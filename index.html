<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>縦読み小説エディタ PRO</title>

<style>
:root{
  --bg:#0b0d10;
  --panel:#11151a;
  --panel2:#171c22;
  --panel3:#1d242c;
  --line:#2b333d;
  --text:#edf1f5;
  --muted:#8d98a5;
  --accent:#9abfff;

  --paper:#f7f3ea;
  --paper2:#eee8dc;
  --ink:#252525;

  --reader-bg:#d9d5cc;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  background:var(--bg);
  color:var(--text);

  font-family:
    system-ui,
    "Noto Sans JP",
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}


/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  height:100dvh;

  display:grid;
  grid-template-rows:58px minmax(0,1fr) 30px;
}


/* =========================================================
   HEADER
========================================================= */

.topbar{
  display:flex;
  align-items:center;

  gap:14px;
  padding:0 16px;

  background:rgba(17,21,26,.98);
  border-bottom:1px solid var(--line);

  z-index:100;
}

.brand{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
}

.brand span{
  color:var(--accent);
}

.title-input{
  width:min(360px,35vw);

  padding:7px 0;

  border:0;
  outline:0;

  background:transparent;
  color:var(--text);

  font-size:15px;
  font-weight:700;
}

.header-actions{
  margin-left:auto;

  display:flex;
  gap:7px;
}

.btn,
.tool{
  border:1px solid var(--line);
  border-radius:8px;

  padding:8px 11px;

  background:var(--panel2);
  color:var(--text);
}

.btn:hover,
.tool:hover{
  background:#1d242c;
}

.btn-primary{
  background:#dce9ff;
  border-color:#dce9ff;
  color:#182237;
  font-weight:700;
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
  min-height:0;

  display:grid;
  grid-template-columns:
    minmax(0,1.15fr)
    minmax(360px,.85fr);
}


/* =========================================================
   READER
========================================================= */

.reader{
  min-width:0;
  min-height:0;

  display:grid;
  grid-template-rows:46px minmax(0,1fr);

  background:var(--reader-bg);

  border-right:1px solid var(--line);

  overflow:hidden;
}

.reader-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:rgba(247,243,234,.96);

  color:#444;

  border-bottom:1px solid #c9c2b7;
}

.reader-header-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.reader-header strong{
  font-size:13px;
}

.reader-header span{
  color:#777;
  font-size:11px;
}

.reader-close{
  display:none;

  border:1px solid #c7c0b5;
  border-radius:7px;

  padding:5px 9px;

  background:#eee8dc;
  color:#444;

  font-size:11px;
}

.reader-viewport{
  min-width:0;
  min-height:0;

  position:relative;

  overflow:hidden;

  padding:28px;

  display:flex;
  align-items:stretch;
  justify-content:center;
}


/* =========================================================
   BOOK
========================================================= */

.book{
  position:relative;

  width:100%;
  min-width:0;
  height:100%;

  background:var(--paper);
  color:var(--ink);

  padding:48px 58px;

  box-shadow:
    0 18px 55px rgba(0,0,0,.22);

  display:grid;

  grid-template-rows:auto auto minmax(0,1fr);

  overflow:hidden;
}

.book-title{
  writing-mode:vertical-rl;
  text-orientation:mixed;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  font-size:30px;
  font-weight:700;

  line-height:1.8;

  margin-bottom:18px;

  white-space:nowrap;
}

.book-meta{
  color:#777;

  font-size:12px;

  margin-bottom:14px;

  white-space:nowrap;
}


/* =========================================================
   PAGINATED PREVIEW
========================================================= */

.preview-stage{
  position:relative;

  min-width:0;
  min-height:0;

  overflow:hidden;
}

.preview-page{
  width:100%;
  height:100%;

  display:none;

  overflow:hidden;

  writing-mode:vertical-rl;
  text-orientation:mixed;
  direction:ltr;

  white-space:pre-wrap;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  font-size:18px;
  line-height:1.9;
  letter-spacing:.08em;

  transform:translateX(0);

  opacity:1;
}

.preview-page.active{
  display:block;
}

.preview-page.page-enter-next{
  animation:pageNext .24s ease-out both;
}

.preview-page.page-enter-prev{
  animation:pagePrev .24s ease-out both;
}

@keyframes pageNext{
  from{
    opacity:0;
    transform:translateX(-16px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes pagePrev{
  from{
    opacity:0;
    transform:translateX(16px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}


/* =========================================================
   PAGE CONTROLS
========================================================= */

.reader-controls{
  position:absolute;

  left:50%;
  bottom:14px;

  transform:translateX(-50%);

  display:flex;
  align-items:center;
  gap:8px;

  padding:6px;

  border:1px solid rgba(80,70,60,.18);
  border-radius:10px;

  background:rgba(247,243,234,.94);

  box-shadow:
    0 8px 24px rgba(0,0,0,.12);

  z-index:10;
}

.page-button{
  width:32px;
  height:30px;

  border:1px solid #c9c2b7;
  border-radius:7px;

  background:#eee8dc;
  color:#444;

  font-weight:700;
}

.page-button:hover{
  background:#e3dccf;
}

.page-indicator{
  min-width:85px;

  text-align:center;

  color:#666;

  font-size:11px;
}


/* =========================================================
   WRITER
========================================================= */

.writer{
  min-width:0;
  min-height:0;

  background:var(--panel);

  display:grid;
  grid-template-rows:50px minmax(0,1fr);
}

.toolbar{
  display:flex;
  align-items:center;

  gap:6px;
  padding:0 10px;

  border-bottom:1px solid var(--line);

  overflow:auto;
}

.tool{
  background:transparent;
  border-color:transparent;

  color:var(--muted);

  white-space:nowrap;
}

.tool.active,
.tool:hover{
  background:#1b222a;
  border-color:var(--line);
  color:var(--text);
}


/* =========================================================
   EDITOR
========================================================= */

.editor-area{
  min-height:0;

  display:grid;
  grid-template-columns:190px minmax(0,1fr);
}

.chapter-list{
  min-height:0;

  overflow:auto;

  padding:10px;

  border-right:1px solid var(--line);
}

.chapter-list-header{
  padding:5px 6px 9px;

  color:var(--muted);

  font-size:12px;
}

.chapter{
  width:100%;

  display:block;

  margin-bottom:5px;

  padding:10px;

  border:1px solid transparent;
  border-radius:8px;

  background:transparent;
  color:#b7c0ca;

  text-align:left;
}

.chapter:hover{
  background:#191f26;
}

.chapter.active{
  background:#202833;

  border-color:#364251;

  color:#fff;
}

.chapter small{
  display:block;

  margin-top:4px;

  color:#7e8996;

  font-size:10px;
}

.editor-wrapper{
  min-width:0;
  min-height:0;

  position:relative;
}

#editor{
  width:100%;
  height:100%;

  resize:none;

  border:0;
  outline:0;

  padding:30px 32px 80px;

  background:#101419;
  color:#edf1f5;

  font-size:17px;
  line-height:1.95;
  letter-spacing:.02em;

  overflow:auto;
}

#editor::selection{
  background:#405f85;
  color:#fff;
}

.editor-info{
  position:absolute;

  right:14px;
  bottom:12px;

  padding:5px 8px;

  border-radius:6px;

  background:rgba(16,20,25,.9);

  color:#7f8995;

  font-size:11px;

  pointer-events:none;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
  display:flex;
  align-items:center;

  padding:0 12px;

  border-top:1px solid var(--line);

  color:var(--muted);

  font-size:11px;
}

.status{
  margin-left:auto;
}


/* =========================================================
   READING MODE
========================================================= */

.reader.reading{
  position:fixed;

  inset:58px 0 30px;

  z-index:200;

  border:0;

  grid-template-rows:minmax(0,1fr);

  background:var(--reader-bg);
}

.reader.reading .reader-header{
  display:flex;

  position:absolute;

  top:0;
  left:0;
  right:0;

  height:46px;

  z-index:20;

  box-shadow:
    0 4px 18px rgba(0,0,0,.08);
}

.reader.reading .reader-close{
  display:block;
}

.reader.reading .reader-viewport{
  padding:58px 50px 42px;
}

.reader.reading .book{
  width:min(1100px,100%);
  height:100%;

  padding:55px 70px;

  border-radius:2px;

  box-shadow:
    0 20px 70px rgba(0,0,0,.20);
}


/* =========================================================
   READING MODE BACKDROP
========================================================= */

.reader.reading::after{
  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.08),
      transparent 65%
    );

  z-index:-1;
}


/* =========================================================
   MODAL
========================================================= */

.modal-bg{
  position:fixed;

  inset:0;

  display:none;

  place-items:center;

  background:rgba(0,0,0,.62);

  z-index:500;
}

.modal-bg.open{
  display:grid;
}

.modal{
  width:min(540px,92vw);

  padding:20px;

  border:1px solid var(--line);
  border-radius:13px;

  background:#161b21;

  box-shadow:
    0 25px 80px rgba(0,0,0,.4);
}

.modal h2{
  margin:0 0 16px;

  font-size:18px;
}

.field{
  display:grid;

  gap:6px;

  margin-bottom:12px;
}

.field label{
  color:var(--muted);

  font-size:12px;
}

.field input,
.field select{
  width:100%;

  padding:9px;

  border:1px solid var(--line);
  border-radius:7px;

  outline:0;

  background:#0e1216;
  color:var(--text);
}

.field-row{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;
}

.modal-actions{
  display:flex;

  justify-content:flex-end;

  gap:7px;

  margin-top:16px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .workspace{
    grid-template-columns:1fr;
  }

  .reader{
    display:none;
  }

  .reader.mobile-preview{
    display:grid;

    position:fixed;

    inset:58px 0 30px;

    z-index:200;

    border:0;
  }

  .editor-area{
    grid-template-columns:145px minmax(0,1fr);
  }

  .reader.mobile-preview .reader-close{
    display:block;
  }
}

@media(max-width:620px){

  .topbar{
    padding:0 10px;
    gap:8px;
  }

  .brand{
    font-size:13px;
  }

  .title-input{
    width:30vw;
    font-size:13px;
  }

  .header-actions .secondary{
    display:none;
  }

  .editor-area{
    grid-template-columns:1fr;
  }

  .chapter-list{
    display:none;
  }

  #editor{
    padding:20px 17px 70px;
    font-size:16px;
  }

  .reader-viewport{
    padding:10px;
  }

  .book{
    padding:25px 22px 55px;
  }

  .book-title{
    font-size:25px;
  }

  .reader.reading .reader-viewport{
    padding:50px 12px 36px;
  }

  .reader.reading .book{
    padding:35px 28px 55px;
  }

  .reader-controls{
    bottom:7px;
  }

  .page-indicator{
    min-width:70px;
  }

}


/* =========================================================
   TOUCH
========================================================= */

.preview-stage{
  touch-action:pan-y;
  user-select:none;
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }

}
</style>
</head>


<body>

<div class="app">

<header class="topbar">

  <div class="brand">
    縦読み小説 <span>PRO</span>
  </div>

  <input
    id="titleInput"
    class="title-input"
    value="新しい物語"
    placeholder="作品タイトル"
  >

  <div class="header-actions">

    <button
      class="btn secondary"
      id="newButton"
    >
      新規
    </button>

    <button
      class="btn secondary"
      id="settingsButton"
    >
      設定
    </button>

    <button
      class="btn btn-primary"
      id="saveButton"
    >
      保存
    </button>

  </div>

</header>


<main class="workspace">


<section
  id="reader"
  class="reader"
>

  <div class="reader-header">

    <div class="reader-header-left">

      <strong>
        完成プレビュー
      </strong>

      <span id="totalCharacters">
        0字
      </span>

      <span id="readerChapter">
        第一章
      </span>

    </div>

    <button
      id="readerClose"
      class="reader-close"
    >
      執筆画面へ戻る
    </button>

  </div>


  <div
    id="readerViewport"
    class="reader-viewport"
  >

    <article class="book">

      <div
        id="bookTitle"
        class="book-title"
      ></div>

      <div
        id="bookMeta"
        class="book-meta"
      ></div>

      <div
        id="previewStage"
        class="preview-stage"
      >

        <div
          id="preview"
          class="preview-page active"
        ></div>

      </div>

      <div class="reader-controls">

        <button
          id="prevPage"
          class="page-button"
          title="前のページ"
        >
          ←
        </button>

        <div
          id="pageIndicator"
          class="page-indicator"
        >
          1 / 1
        </div>

        <button
          id="nextPage"
          class="page-button"
          title="次のページ"
        >
          →
        </button>

      </div>

    </article>

  </div>

</section>


<section class="writer">

  <div class="toolbar">

    <button
      id="writeMode"
      class="tool active"
    >
      執筆
    </button>

    <button
      id="readingMode"
      class="tool"
    >
      読書
    </button>

    <button
      id="mobilePreview"
      class="tool"
    >
      プレビュー
    </button>

    <button
      id="addChapter"
      class="tool"
    >
      ＋章
    </button>

    <button
      id="exportTxt"
      class="tool"
    >
      TXT
    </button>

    <button
      id="exportHtml"
      class="tool"
    >
      HTML
    </button>

  </div>


  <div class="editor-area">

    <aside class="chapter-list">

      <div class="chapter-list-header">
        章
        <span id="chapterCount">1</span>
      </div>

      <div id="chapters"></div>

    </aside>


    <div class="editor-wrapper">

      <textarea
        id="editor"
        spellcheck="false"
        placeholder="ここに小説を書いてください。入力した文章は左側の完成プレビューへ反映されます。"
      ></textarea>


      <div class="editor-info">

        <span id="characterCount">
          0字
        </span>

        <span>　</span>

        <span id="lineCount">
          0行
        </span>

        <span>　</span>

        <span id="saveState">
          未保存
        </span>

      </div>

    </div>

  </div>

</section>

</main>


<footer class="footer">

  <span>
    縦書き・右端から左方向へページ進行
  </span>

  <span
    class="status"
    id="status"
  >
    準備完了
  </span>

</footer>

</div>


<!-- =======================================================
     SETTINGS
======================================================= -->

<div
  id="settingsModal"
  class="modal-bg"
>

  <div class="modal">

    <h2>
      表示設定
    </h2>


    <div class="field-row">

      <div class="field">

        <label>
          文字サイズ
        </label>

        <input
          id="fontSize"
          type="number"
          min="12"
          max="40"
        >

      </div>


      <div class="field">

        <label>
          行間
        </label>

        <input
          id="lineHeight"
          type="number"
          min="1"
          max="3"
          step=".05"
        >

      </div>

    </div>


    <div class="field-row">

      <div class="field">

        <label>
          字間
        </label>

        <input
          id="letterSpacing"
          type="number"
          min="0"
          max=".5"
          step=".01"
        >

      </div>


      <div class="field">

        <label>
          書体
        </label>

        <select id="fontFamily">

          <option
            value='"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif'
          >
            明朝
          </option>

          <option
            value='"Noto Sans JP",system-ui,sans-serif'
          >
            ゴシック
          </option>

        </select>

      </div>

    </div>


    <div class="modal-actions">

      <button
        class="btn"
        id="closeSettings"
      >
        閉じる
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     NEW WORK
======================================================= -->

<div
  id="newModal"
  class="modal-bg"
>

  <div class="modal">

    <h2>
      新しい作品
    </h2>

    <div class="field">

      <label>
        作品タイトル
      </label>

      <input
        id="newTitle"
        value="新しい物語"
      >

    </div>


    <div class="modal-actions">

      <button
        class="btn"
        id="cancelNew"
      >
        キャンセル
      </button>

      <button
        class="btn btn-primary"
        id="createNew"
      >
        作成
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   STATE
========================================================= */

const STORAGE_KEY =
  "vertical-novel-pro-v2";


const $ = id =>
  document.getElementById(id);


function createDefaultState(){

  return {

    title:"新しい物語",

    activeChapter:0,

    chapters:[
      {
        title:"第一章",
        text:""
      }
    ],

    settings:{

      fontSize:18,

      lineHeight:1.9,

      letterSpacing:.08,

      fontFamily:
        '"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif'

    }

  };

}


function normalizeState(parsed){

  const fallback =
    createDefaultState();

  if(
    !parsed ||
    !Array.isArray(parsed.chapters) ||
    !parsed.chapters.length
  ){
    return fallback;
  }

  parsed.title =
    typeof parsed.title === "string"
      ? parsed.title
      : fallback.title;

  parsed.activeChapter =
    Math.max(
      0,
      Math.min(
        Number(parsed.activeChapter) || 0,
        parsed.chapters.length - 1
      )
    );

  parsed.chapters =
    parsed.chapters.map(
      (chapter,index)=>({

        title:
          typeof chapter.title === "string"
            ? chapter.title
            : `第${index + 1}章`,

        text:
          typeof chapter.text === "string"
            ? chapter.text
            : ""

      })
    );

  parsed.settings =
    {
      ...fallback.settings,
      ...(parsed.settings || {})
    };

  return parsed;

}


function loadState(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw){

      return createDefaultState();

    }

    return normalizeState(
      JSON.parse(raw)
    );

  }catch{

    return createDefaultState();

  }

}


let state =
  loadState();


let saveTimer = null;


/* =========================================================
   READING STATE
========================================================= */

let pages = [];

let currentPage = 0;

let pageBuildTimer = null;

let displayedPreviewText = "";

let animationTimer = null;

let animationToken = 0;

let touchStartX = 0;


/* =========================================================
   UTILITY
========================================================= */

function characterLength(text){

  return [...text].length;

}


function escapeHtml(text){

  return text.replace(
    /[&<>"']/g,
    char=>{

      const map={

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      };

      return map[char];

    }
  );

}


function currentChapter(){

  return state.chapters[
    state.activeChapter
  ];

}


function syncEditor(){

  const chapter =
    currentChapter();

  if(!chapter){
    return;
  }

  chapter.text =
    $("editor").value;

}


/* =========================================================
   PAGE CREATION
========================================================= */

/*
  長文を1つの巨大な縦書き領域にしない。
  画面の高さに応じてページ単位へ分割する。
*/

function calculateCharactersPerPage(){

  const stage =
    $("previewStage");

  if(!stage){

    return 450;

  }

  const height =
    stage.clientHeight;

  const fontSize =
    Number(state.settings.fontSize) || 18;

  const lineHeight =
    Number(state.settings.lineHeight) || 1.9;

  const letterHeight =
    fontSize * lineHeight;

  const usableHeight =
    Math.max(
      240,
      height - 20
    );

  const rows =
    Math.max(
      8,
      Math.floor(
        usableHeight /
        letterHeight
      )
    );

  /*
    1ページあたりの縦列数を
    画面幅から概算。
  */

  const width =
    Math.max(
      300,
      stage.clientWidth
    );

  const columnWidth =
    fontSize * 2.1;

  const columns =
    Math.max(
      3,
      Math.floor(
        width /
        columnWidth
      )
    );

  return Math.max(
    80,
    rows * columns
  );

}


function splitTextIntoPages(text){

  if(!text){

    return [""];

  }

  const chars =
    [...text];

  const perPage =
    calculateCharactersPerPage();

  const result = [];

  let buffer = "";

  /*
    単純に文字数だけで切らず、
    可能な限り句点・改行を境界にする。
  */

  let index = 0;

  while(index < chars.length){

    let end =
      Math.min(
        index + perPage,
        chars.length
      );

    if(end < chars.length){

      const searchStart =
        Math.max(
          index + Math.floor(perPage * .65),
          index
        );

      const candidates =
        chars
          .slice(
            searchStart,
            end
          );

      let best = -1;

      for(
        let i=0;
        i<candidates.length;
        i++
      ){

        if(
          candidates[i] === "。" ||
          candidates[i] === "！" ||
          candidates[i] === "？" ||
          candidates[i] === "\n"
        ){

          best = i;

        }

      }

      if(best >= 0){

        end =
          searchStart +
          best +
          1;

      }

    }

    buffer =
      chars
        .slice(
          index,
          end
        )
        .join("");

    result.push(buffer);

    index = end;

  }

  return result.length
    ? result
    : [""];

}


/* =========================================================
   BUILD PAGES
========================================================= */

function buildPages(){

  clearTimeout(
    pageBuildTimer
  );

  pageBuildTimer =
    setTimeout(
      ()=>{
        actuallyBuildPages();
      },
      30
    );

}


function actuallyBuildPages(){

  syncEditor();

  const chapter =
    currentChapter();

  if(!chapter){

    pages = [""];

    currentPage = 0;

    return;

  }

  const oldPage =
    currentPage;

  pages =
    splitTextIntoPages(
      chapter.text
    );

  currentPage =
    Math.min(
      oldPage,
      Math.max(
        0,
        pages.length - 1
      )
    );

  renderCurrentPage(
    false
  );

  updatePageIndicator();

}


/* =========================================================
   RENDER CURRENT PAGE
========================================================= */

function renderCurrentPage(
  animate=true,
  direction="next"
){

  const stage =
    $("previewStage");

  const preview =
    $("preview");

  if(!stage || !preview){
    return;
  }

  const text =
    pages[currentPage] ?? "";

  preview.className =
    "preview-page active";

  if(animate){

    preview.classList.add(
      direction === "prev"
        ? "page-enter-prev"
        : "page-enter-next"
    );

  }

  preview.textContent =
    text;

  applySettings();

}


function updatePageIndicator(){

  $("pageIndicator").textContent =
    `${currentPage + 1} / ${Math.max(1,pages.length)}`;

  $("prevPage").disabled =
    currentPage <= 0;

  $("nextPage").disabled =
    currentPage >= pages.length - 1;

}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function nextPage(){

  if(currentPage >= pages.length - 1){

    return;

  }

  currentPage++;

  renderCurrentPage(
    true,
    "next"
  );

  updatePageIndicator();

}


function prevPage(){

  if(currentPage <= 0){

    return;

  }

  currentPage--;

  renderCurrentPage(
    true,
    "prev"
  );

  updatePageIndicator();

}


$("nextPage").addEventListener(
  "click",
  nextPage
);


$("prevPage").addEventListener(
  "click",
  prevPage
);


/* =========================================================
   ANIMATION
========================================================= */

function getAnimationSpeed(
  addedLength
){

  if(addedLength <= 5){
    return 28;
  }

  if(addedLength <= 20){
    return 18;
  }

  if(addedLength <= 80){
    return 7;
  }

  return 1;

}


function animatePreview(
  newText
){

  clearTimeout(
    animationTimer
  );

  const token =
    ++animationToken;

  /*
    大幅変更ならページを再構築。
  */

  if(
    !newText.startsWith(
      displayedPreviewText
    ) ||
    newText.length <
      displayedPreviewText.length
  ){

    displayedPreviewText =
      newText;

    currentPage =
      pages.length - 1;

    buildPages();

    return;

  }

  const oldText =
    displayedPreviewText;

  const addedText =
    newText.slice(
      oldText.length
    );

  if(!addedText){

    return;

  }

  /*
    長文入力ではアニメーションを
    実質即時にする。
  */

  const speed =
    getAnimationSpeed(
      [...addedText].length
    );

  displayedPreviewText =
    newText;

  buildPages();

  /*
    入力中は最新ページへ追従。
  */

  const newPages =
    splitTextIntoPages(
      newText
    );

  pages =
    newPages;

  currentPage =
    pages.length - 1;

  const preview =
    $("preview");

  const full =
    pages[currentPage] || "";

  /*
    短い入力だけ簡易タイプ演出。
  */

  if(
    speed >= 7 &&
    full.length > 0
  ){

    let i = 0;

    preview.textContent = "";

    function type(){

      if(token !== animationToken){
        return;
      }

      if(i >= full.length){

        preview.textContent =
          full;

        updatePageIndicator();

        return;

      }

      preview.textContent =
        full.slice(
          0,
          ++i
        );

      animationTimer =
        setTimeout(
          type,
          speed
        );

    }

    type();

  }else{

    renderCurrentPage(
      false
    );

  }

  updatePageIndicator();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  syncEditor();

  const chapter =
    currentChapter();

  if(!chapter){
    return;
  }

  const total =
    state.chapters.reduce(
      (sum,item)=>
        sum +
        characterLength(
          item.text
        ),
      0
    );

  $("titleInput").value =
    state.title;

  $("bookTitle").textContent =
    state.title;

  $("bookMeta").textContent =
    chapter.title +
    "　" +
    characterLength(
      chapter.text
    ).toLocaleString() +
    "字";

  $("readerChapter").textContent =
    chapter.title;

  $("characterCount").textContent =
    characterLength(
      chapter.text
    ).toLocaleString() +
    "字";

  $("lineCount").textContent =
    (
      chapter.text
        ? chapter.text.split("\n").length
        : 0
    ).toLocaleString() +
    "行";

  $("totalCharacters").textContent =
    total.toLocaleString() +
    "字";

  renderChapters();

  applySettings();

}


/* =========================================================
   CHAPTER LIST
========================================================= */

function renderChapters(){

  const container =
    $("chapters");

  container.innerHTML =
    "";

  state.chapters.forEach(
    (chapter,index)=>{

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "chapter" +
        (
          index ===
          state.activeChapter
            ? " active"
            : ""
        );

      button.innerHTML =
        escapeHtml(
          chapter.title
        ) +
        "<small>" +
        characterLength(
          chapter.text
        ).toLocaleString() +
        "字</small>";

      button.addEventListener(
        "click",
        ()=>{
          switchChapter(index);
        }
      );

      container.appendChild(
        button
      );

    }
  );

  $("chapterCount").textContent =
    state.chapters.length;

}


/* =========================================================
   SWITCH CHAPTER
========================================================= */

function switchChapter(
  index
){

  clearTimeout(
    animationTimer
  );

  animationToken++;

  syncEditor();

  state.activeChapter =
    index;

  const chapter =
    currentChapter();

  $("editor").value =
    chapter.text;

  displayedPreviewText =
    chapter.text;

  currentPage =
    0;

  pages =
    splitTextIntoPages(
      chapter.text
    );

  render();

  renderCurrentPage(
    false
  );

  updatePageIndicator();

  scheduleSave();

}


/* =========================================================
   SAVE
========================================================= */

function scheduleSave(){

  clearTimeout(
    saveTimer
  );

  $("saveState").textContent =
    "保存中…";

  $("status").textContent =
    "編集中";

  saveTimer =
    setTimeout(
      saveState,
      400
    );

}


function saveState(){

  clearTimeout(
    saveTimer
  );

  syncEditor();

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

  $("saveState").textContent =
    "保存済み";

  $("status").textContent =
    "保存しました";

}


$("saveButton").addEventListener(
  "click",
  saveState
);

========================================================= */

    settings.fontFamily;

}

);


/* =========================================================
   READING MODE
========================================================= */

function enterReadingMode(){

  syncEditor();

  buildPages();

  $("reader")
    .classList
    .add("reading");

  $("readingMode")
    .classList
    .add("active");

  $("writeMode")
    .classList
    .remove("active");

  $("mobilePreview")
    .classList
    .remove("active");

  /*
    読書開始時は現在章の最初のページ。
  */

  currentPage = 0;

  pages =
    splitTextIntoPages(
      currentChapter().text
    );

  renderCurrentPage(
    false
  );

  updatePageIndicator();

}


function exitReadingMode(){

  $("reader")
    .classList
    .remove("reading");

  $("writeMode")
    .classList
    .add("active");

  $("readingMode")
    .classList
    .remove("active");

  $("mobilePreview")
    .classList
    .remove("active");

}


$("readingMode").addEventListener(
  "click",
  enterReadingMode
);


$("writeMode").addEventListener(
  "click",
  exitReadingMode
);


$("readerClose").addEventListener(
  "click",
  exitReadingMode
);


/* =========================================================
   MOBILE PREVIEW
========================================================= */

$("mobilePreview").addEventListener(
  "click",
  ()=>{

    const reader =
      $("reader");

    if(
      reader.classList.contains(
        "mobile-preview"
      )
    ){

      reader.classList.remove(
        "mobile-preview"
      );

      return;

    }

    reader.classList.add(
      "mobile-preview"
    );

    buildPages();

  }
);


/* =========================================================
   TOUCH SWIPE
========================================================= */

$("previewStage").addEventListener(
  "touchstart",
  event=>{

    if(!event.touches.length){
      return;
    }

    touchStartX =
      event.touches[0].clientX;

  },
  {passive:true}
);


$("previewStage").addEventListener(
  "touchend",
  event=>{

    if(!touchStartX){
      return;
    }

    const endX =
      event.changedTouches[0].clientX;

    const diff =
      endX - touchStartX;

    touchStartX = 0;

    if(Math.abs(diff) < 45){
      return;
    }

    /*
      縦書き読書では
      左へスワイプ = 次
      右へスワイプ = 前
    */

    if(diff < 0){

      nextPage();

    }else{

      prevPage();

    }

  },
  {passive:true}
);


/* =========================================================
   EXPORT
========================================================= */

function downloadFile(
  filename,
  content,
  mime
){

  const blob =
    new Blob(
      [content],
      {
        type:mime
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const link =
    document.createElement(
      "a"
    );

  link.href =
    url;

  link.download =
    filename;

  document.body.appendChild(
    link
  );

  link.click();

  link.remove();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    /*
      Ctrl / Cmd + S
    */

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() === "s"
    ){

      event.preventDefault();

      saveState();

      return;

    }


    /*
      Escape
    */

    if(
      event.key === "Escape"
    ){

      document
        .querySelectorAll(
          ".modal-bg.open"
        )
        .forEach(
          modal =>
            modal.classList.remove(
              "open"
            )
        );

      if(
        $("reader")
          .classList
          .contains("reading")
      ){

        exitReadingMode();

      }

      return;

    }


    /*
      読書モード中だけ
      ページ送りを有効化。
    */

    if(
      $("reader")
        .classList
        .contains("reading")
    ){

      /*
        矢印
      */

      if(
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "d"
      ){

        event.preventDefault();

        nextPage();

        return;

      }

      if(
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "a"
      ){

        event.preventDefault();

        prevPage();

        return;

      }

      /*
        Space
      */

      if(
        event.code === "Space"
      ){

        event.preventDefault();

        nextPage();

      }

    }

  }
);
