<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>縦読み小説エディタ PRO</title>

<style>
:root{
  --bg:#0b0d10;
  --panel:#11151a;
  --panel2:#171c22;
  --panel3:#1c232b;
  --line:#2b333d;
  --text:#edf1f5;
  --muted:#8d98a5;
  --accent:#9abfff;

  --paper:#f7f3ea;
  --paper2:#eee8dc;
  --ink:#252525;
  --paper-muted:#77716a;

  --header:58px;
  --footer:30px;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  height:100dvh;

  display:grid;
  grid-template-rows:
    var(--header)
    minmax(0,1fr)
    var(--footer);
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
  position:relative;
  z-index:100;

  display:flex;
  align-items:center;
  gap:14px;

  padding:0 16px;

  background:rgba(17,21,26,.98);
  border-bottom:1px solid var(--line);
}

.brand{
  flex:none;

  font-size:15px;
  font-weight:800;
  white-space:nowrap;
}

.brand span{
  color:var(--accent);
}

.title-input{
  width:min(380px,35vw);

  padding:7px 0;

  border:0;
  outline:0;

  background:transparent;
  color:var(--text);

  font-size:15px;
  font-weight:700;
}

.header-actions{
  margin-left:auto;

  display:flex;
  gap:7px;
}

.btn,
.tool{
  border:1px solid var(--line);
  border-radius:8px;

  padding:8px 11px;

  background:var(--panel2);
  color:var(--text);

  transition:
    background .15s,
    border-color .15s,
    transform .1s;
}

.btn:hover,
.tool:hover{
  background:#1d242c;
}

.btn:active,
.tool:active{
  transform:translateY(1px);
}

.btn-primary{
  background:#dce9ff;
  border-color:#dce9ff;
  color:#182237;
  font-weight:700;
}

.btn-primary:hover{
  background:#eef5ff;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
  min-width:0;
  min-height:0;

  display:grid;
  grid-template-columns:
    minmax(0,1.18fr)
    minmax(360px,.82fr);
}

/* =========================================================
   READER
========================================================= */

.reader{
  min-width:0;
  min-height:0;

  display:grid;
  grid-template-rows:46px minmax(0,1fr);

  background:#d9d5cc;
  border-right:1px solid var(--line);

  overflow:hidden;
}

.reader-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:rgba(247,243,234,.97);
  color:#444;

  border-bottom:1px solid #c9c2b7;
}

.reader-header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.reader-header strong{
  font-size:13px;
}

.reader-header span{
  color:#777;
  font-size:11px;
}

.reader-position{
  min-width:70px;
  text-align:right;
}

/* =========================================================
   READER VIEWPORT
========================================================= */

.reader-viewport{
  position:relative;

  min-width:0;
  min-height:0;

  overflow-x:auto;
  overflow-y:hidden;

  padding:28px;

  background:
    radial-gradient(
      circle at center,
      #e1ddd4 0,
      #d8d3c9 100%
    );

  direction:ltr;

  overscroll-behavior-x:contain;

  scrollbar-width:auto;

  cursor:grab;

  -webkit-overflow-scrolling:touch;

  touch-action:pan-x;
}

.reader-viewport.dragging{
  cursor:grabbing;
  user-select:none;
}

.reader-viewport::-webkit-scrollbar{
  height:13px;
}

.reader-viewport::-webkit-scrollbar-track{
  background:#c3beb4;
}

.reader-viewport::-webkit-scrollbar-thumb{
  background:#888177;
  border-radius:20px;
  border:3px solid #c3beb4;
}

.reader-viewport::-webkit-scrollbar-thumb:hover{
  background:#6f6961;
}

/*
  重要:
  ここを横方向の「原稿キャンバス」にする。

  width:max-content により、
  縦書き本文が増えた分だけ原稿面自体が横へ広がる。
*/

.reader-canvas{
  position:relative;

  width:max-content;
  min-width:100%;

  height:100%;
  min-height:100%;

  display:flex;
  justify-content:flex-start;
  align-items:stretch;
}

/* =========================================================
   BOOK
========================================================= */

.book{
  position:relative;

  flex:none;

  width:max-content;
  min-width:100%;

  height:100%;

  background:var(--paper);
  color:var(--ink);

  padding:48px 64px;

  box-shadow:
    0 18px 55px rgba(0,0,0,.22);

  overflow:visible;
}

/*
  上部情報。
  縦書き本文とは別レイヤー。
*/

.book-header{
  position:absolute;

  top:18px;
  left:28px;

  display:flex;
  align-items:center;
  gap:12px;

  color:var(--paper-muted);

  font-size:11px;

  white-space:nowrap;
}

.book-title{
  position:absolute;

  top:44px;
  left:54px;

  writing-mode:vertical-rl;
  text-orientation:mixed;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  font-size:30px;
  font-weight:700;

  line-height:1.8;

  white-space:nowrap;
}

/*
  本文専用のラッパー。

  高さは画面に収め、
  横幅はJavaScriptで本文の列数に応じて決定する。
*/

.vertical-stage{
  position:absolute;

  top:42px;
  right:64px;
  bottom:42px;
  left:220px;

  height:calc(100% - 84px);

  overflow:visible;
}

/*
  実際の縦書き本文。

  height固定
  width:max-content

  が重要。
*/

.vertical-text{
  position:absolute;

  top:0;
  right:0;

  writing-mode:vertical-rl;
  text-orientation:mixed;

  direction:ltr;

  height:100%;
  width:max-content;

  min-width:max-content;

  white-space:pre-wrap;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  font-size:18px;
  line-height:1.9;
  letter-spacing:.08em;

  overflow:visible;

  word-break:normal;

  user-select:text;
}

/*
  本文が空の場合でも原稿面を確保。
*/

.vertical-text.empty{
  min-width:1px;
  min-height:1px;
}

/* =========================================================
   CHARACTER ANIMATION
========================================================= */

.novel-char{
  display:inline;
  opacity:1;
}

.novel-char.typing{
  animation:
    novelCharacterIn
    .18s
    cubic-bezier(.2,.75,.25,1)
    both;
}

@keyframes novelCharacterIn{
  0%{
    opacity:0;
    filter:blur(3px);
  }

  45%{
    opacity:.55;
    filter:blur(1px);
  }

  100%{
    opacity:1;
    filter:blur(0);
  }
}

.novel-char.latest{
  animation:
    novelLatest
    .28s
    ease-out
    both;
}

@keyframes novelLatest{
  0%{
    opacity:.15;
    text-shadow:0 0 8px rgba(60,50,35,.25);
  }

  100%{
    opacity:1;
    text-shadow:none;
  }
}

/* =========================================================
   READER CONTROLS
========================================================= */

.reader-controls{
  position:absolute;

  left:50%;
  bottom:22px;

  transform:translateX(-50%);

  z-index:20;

  display:flex;
  align-items:center;
  gap:6px;

  padding:6px;

  background:rgba(20,22,24,.84);

  border:1px solid rgba(255,255,255,.12);

  border-radius:10px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.2);

  backdrop-filter:blur(12px);
}

.reader-control{
  width:38px;
  height:32px;

  border:0;
  border-radius:6px;

  background:transparent;
  color:#fff;

  font-size:16px;
}

.reader-control:hover{
  background:rgba(255,255,255,.1);
}

.reader-control-label{
  padding:0 8px;

  color:#d9d9d9;

  font-size:11px;

  white-space:nowrap;
}

/* =========================================================
   WRITER
========================================================= */

.writer{
  min-width:0;
  min-height:0;

  background:var(--panel);

  display:grid;
  grid-template-rows:50px minmax(0,1fr);
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  display:flex;
  align-items:center;
  gap:6px;

  padding:0 10px;

  border-bottom:1px solid var(--line);

  overflow:auto;
}

.tool{
  background:transparent;
  border-color:transparent;

  color:var(--muted);

  white-space:nowrap;
}

.tool.active,
.tool:hover{
  background:#1b222a;
  border-color:var(--line);
  color:var(--text);
}

/* =========================================================
   EDITOR AREA
========================================================= */

.editor-area{
  min-width:0;
  min-height:0;

  display:grid;
  grid-template-columns:190px minmax(0,1fr);
}

/* =========================================================
   CHAPTER LIST
========================================================= */

.chapter-list{
  min-width:0;
  min-height:0;

  overflow:auto;

  padding:10px;

  border-right:1px solid var(--line);
}

.chapter-list-header{
  padding:5px 6px 9px;

  color:var(--muted);

  font-size:12px;
}

.chapter{
  width:100%;

  display:block;

  margin-bottom:5px;
  padding:10px;

  border:1px solid transparent;
  border-radius:8px;

  background:transparent;
  color:#b7c0ca;

  text-align:left;

  transition:
    background .15s,
    border-color .15s;
}

.chapter:hover{
  background:#191f26;
}

.chapter.active{
  background:#202833;
  border-color:#364251;
  color:#fff;
}

.chapter-title-row{
  display:flex;
  align-items:center;
  gap:6px;
}

.chapter-title{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chapter small{
  display:block;

  margin-top:4px;

  color:#7e8996;

  font-size:10px;
}

/* =========================================================
   EDITOR
========================================================= */

.editor-wrapper{
  min-width:0;
  min-height:0;

  position:relative;
}

#editor{
  width:100%;
  height:100%;

  resize:none;

  border:0;
  outline:0;

  padding:30px 32px 80px;

  background:#101419;
  color:#edf1f5;

  font-size:17px;
  line-height:1.95;
  letter-spacing:.02em;

  overflow:auto;

  tab-size:2;
}

#editor::selection{
  background:#405f85;
  color:#fff;
}

.editor-info{
  position:absolute;

  right:14px;
  bottom:12px;

  display:flex;
  align-items:center;

  padding:5px 8px;

  border-radius:6px;

  background:rgba(16,20,25,.9);

  color:#7f8995;

  font-size:11px;

  pointer-events:none;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  display:flex;
  align-items:center;

  padding:0 12px;

  border-top:1px solid var(--line);

  color:var(--muted);

  font-size:11px;
}

.status{
  margin-left:auto;
}

/* =========================================================
   MODAL
========================================================= */

.modal-bg{
  position:fixed;
  inset:0;

  display:none;
  place-items:center;

  background:rgba(0,0,0,.62);

  z-index:1000;
}

.modal-bg.open{
  display:grid;
}

.modal{
  width:min(540px,92vw);

  padding:20px;

  border:1px solid var(--line);
  border-radius:13px;

  background:#161b21;

  box-shadow:
    0 25px 80px rgba(0,0,0,.4);
}

.modal h2{
  margin:0 0 16px;

  font-size:18px;
}

.field{
  display:grid;
  gap:6px;

  margin-bottom:12px;
}

.field label{
  color:var(--muted);
  font-size:12px;
}

.field input,
.field select{
  width:100%;

  padding:9px;

  border:1px solid var(--line);
  border-radius:7px;

  outline:0;

  background:#0e1216;
  color:var(--text);
}

.field-row{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:10px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;

  margin-top:16px;
}

/* =========================================================
   READING MODE
========================================================= */

body.reading-mode .topbar{
  display:none;
}

body.reading-mode .workspace{
  grid-template-columns:1fr;
}

body.reading-mode .writer{
  display:none;
}

.reader.reading{
  position:fixed;

  inset:0;

  z-index:500;

  display:grid;

  grid-template-rows:46px minmax(0,1fr);

  border:0;
}

.reader.reading .reader-header{
  display:flex;
}

.reader.reading .reader-viewport{
  padding:34px 50px 48px;
}

.reader.reading .book{
  min-height:100%;
}

.reader.reading .reader-controls{
  bottom:22px;
}

/*
  読書モード専用の戻るボタン。
*/

.reading-back{
  display:none;

  position:absolute;

  top:9px;
  left:12px;

  z-index:50;

  padding:7px 11px;

  border:1px solid rgba(0,0,0,.15);
  border-radius:7px;

  background:rgba(255,255,255,.72);

  color:#333;

  font-size:12px;
}

.reader.reading .reading-back{
  display:block;
}

/* =========================================================
   MOBILE PREVIEW
========================================================= */

@media(max-width:900px){

  .workspace{
    grid-template-columns:1fr;
  }

  .reader{
    display:none;
  }

  .reader.mobile-preview{
    display:grid;

    position:fixed;

    inset:var(--header) 0 var(--footer);

    z-index:500;

    border:0;
  }

  .editor-area{
    grid-template-columns:145px minmax(0,1fr);
  }

  .reader.mobile-preview .reader-viewport{
    padding:16px;
  }

}

/* =========================================================
   TABLET
========================================================= */

@media(max-width:760px){

  .title-input{
    width:30vw;
  }

  .editor-area{
    grid-template-columns:130px minmax(0,1fr);
  }

  .book{
    padding-left:42px;
    padding-right:42px;
  }

  .vertical-stage{
    left:170px;
    right:42px;
  }

}

/* =========================================================
   PHONE
========================================================= */

@media(max-width:620px){

  .topbar{
    padding:0 10px;
    gap:8px;
  }

  .brand{
    font-size:13px;
  }

  .title-input{
    width:30vw;
    font-size:13px;
  }

  .header-actions .secondary{
    display:none;
  }

  .editor-area{
    grid-template-columns:1fr;
  }

  .chapter-list{
    display:none;
  }

  #editor{
    padding:20px 17px 70px;
    font-size:16px;
  }

  .reader.mobile-preview .reader-viewport{
    padding:10px;
  }

  .reader.mobile-preview .book{
    padding-left:24px;
    padding-right:24px;
  }

  .reader.mobile-preview .vertical-stage{
    left:120px;
    right:24px;
  }

  .book-title{
    left:22px;
    top:38px;
    font-size:24px;
  }

  .book-header{
    left:20px;
  }

  .reader-controls{
    bottom:10px;
  }

}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    scroll-behavior:auto !important;
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
  }

}
</style>
</head>

<body>

<div class="app">

<!-- =======================================================
     HEADER
======================================================= -->

<header class="topbar">

  <div class="brand">
    縦読み小説 <span>PRO</span>
  </div>

  <input
    id="titleInput"
    class="title-input"
    value="新しい物語"
    placeholder="作品タイトル"
    autocomplete="off"
  >

  <div class="header-actions">

    <button
      class="btn secondary"
      id="newButton"
      type="button"
    >
      新規
    </button>

    <button
      class="btn secondary"
      id="settingsButton"
      type="button"
    >
      設定
    </button>

    <button
      class="btn btn-primary"
      id="saveButton"
      type="button"
    >
      保存
    </button>

  </div>

</header>


<!-- =======================================================
     WORKSPACE
======================================================= -->

<main class="workspace">

<!-- =======================================================
     READER
======================================================= -->

<section
  id="reader"
  class="reader"
>

  <div class="reader-header">

    <div class="reader-header-left">

      <strong>
        完成プレビュー
      </strong>

      <span id="previewChapter">
        第一章
      </span>

    </div>

    <span
      class="reader-position"
      id="totalCharacters"
    >
      0字
    </span>

  </div>


  <div
    id="readerViewport"
    class="reader-viewport"
  >

    <div
      id="readerCanvas"
      class="reader-canvas"
    >

      <article class="book">

        <div class="book-header">

          <span>
            縦読み小説 PRO
          </span>

          <span>
            ・
          </span>

          <span id="bookMeta">
            第一章　0字
          </span>

        </div>


        <div
          id="bookTitle"
          class="book-title"
        ></div>


        <div
          id="verticalStage"
          class="vertical-stage"
        >

          <div
            id="preview"
            class="vertical-text empty"
          ></div>

        </div>

      </article>

    </div>


    <!-- 読書操作 -->

    <div class="reader-controls">

      <button
        id="readerPrev"
        class="reader-control"
        type="button"
        title="左へ"
      >
        ←
      </button>

      <div
        id="readerControlLabel"
        class="reader-control-label"
      >
        ドラッグ / ホイール / ← →
      </div>

      <button
        id="readerNext"
        class="reader-control"
        type="button"
        title="右へ"
      >
        →
      </button>

    </div>


    <button
      id="readingBack"
      class="reading-back"
      type="button"
    >
      ← 執筆へ戻る
    </button>

  </div>

</section>


<!-- =======================================================
     WRITER
======================================================= -->

<section class="writer">

  <div class="toolbar">

    <button
      id="writeMode"
      class="tool active"
      type="button"
    >
      執筆
    </button>

    <button
      id="readingMode"
      class="tool"
      type="button"
    >
      読書
    </button>

    <button
      id="mobilePreview"
      class="tool"
      type="button"
    >
      プレビュー
    </button>

    <button
      id="addChapter"
      class="tool"
      type="button"
    >
      ＋章
    </button>

    <button
      id="renameChapter"
      class="tool"
      type="button"
    >
      章名変更
    </button>

    <button
      id="deleteChapter"
      class="tool"
      type="button"
    >
      章削除
    </button>

    <button
      id="exportTxt"
      class="tool"
      type="button"
    >
      TXT
    </button>

    <button
      id="exportHtml"
      class="tool"
      type="button"
    >
      HTML
    </button>

  </div>


  <div class="editor-area">

    <aside class="chapter-list">

      <div class="chapter-list-header">

        章
        <span id="chapterCount">
          1
        </span>

      </div>

      <div id="chapters"></div>

    </aside>


    <div class="editor-wrapper">

      <textarea
        id="editor"
        spellcheck="false"
        placeholder="ここに小説を書いてください。入力した文章は左側にリアルタイムで縦書き表示されます。"
      ></textarea>


      <div class="editor-info">

        <span id="characterCount">
          0字
        </span>

        <span>　</span>

        <span id="lineCount">
          0行
        </span>

        <span>　</span>

        <span id="saveState">
          未保存
        </span>

      </div>

    </div>

  </div>

</section>

</main>


<!-- =======================================================
     FOOTER
======================================================= -->

<footer class="footer">

  <span>
    縦書き / 右端開始 / 横スクロール
  </span>

  <span
    class="status"
    id="status"
  >
    準備完了
  </span>

</footer>

</div>


<!-- =======================================================
     SETTINGS MODAL
======================================================= -->

<div
  id="settingsModal"
  class="modal-bg"
>

  <div class="modal">

    <h2>
      表示設定
    </h2>


    <div class="field-row">

      <div class="field">

        <label>
          文字サイズ
        </label>

        <input
          id="fontSize"
          type="number"
          min="12"
          max="40"
          step="1"
        >

      </div>

          step=".05"
        >

    <div class="field-row">

      <div class="field">

        <label>
          字間
        </label>

        <input
          id="letterSpacing"
          type="number"
          min="0"
          max=".5"
          step=".01"
        >

      </div>


      <div class="field">

        <label>
          書体
        </label>

        <select id="fontFamily">

          <option value='"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif'>
            明朝
          </option>

          <option value='"Noto Sans JP",system-ui,sans-serif'>
            ゴシック
          </option>

        </select>

      </div>

    </div>


    <div class="modal-actions">

      <button
        class="btn"
        id="closeSettings"
        type="button"
      >
        閉じる
      </button>

  </div>

</div>


<!-- =======================================================
     NEW MODAL
======================================================= -->

<div
  id="newModal"
  class="modal-bg"
>

  <div class="modal">

    <h2>
      新しい作品
    </h2>


    <div class="field">

        作品タイトル
      </label>

      <input
        id="newTitle"
        value="新しい物語"
        autocomplete="off"
      >

      >
        キャンセル

        type="button"
      >
        作成
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     CHAPTER NAME MODAL
======================================================= -->

<div
  id="chapterModal"
  class="modal-bg"
>

  <div class="modal">

    <h2>
      章名を変更
    </h2>


    <div class="field">

      <label>
        章タイトル
      </label>

      <input
        id="chapterTitleInput"
        autocomplete="off"
      >

    </div>


    <div class="modal-actions">

      <button
        class="btn"
        id="cancelChapter"
        type="button"
      >
        キャンセル
      </button>

      <button
        class="btn btn-primary"
        id="saveChapterTitle"
        type="button"
      >
        変更
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
  "vertical-novel-pro-v3";


/* =========================================================
   DOM
========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
   STATE
========================================================= */

function createDefaultState(){

  return {

    title:"新しい物語",

    activeChapter:0,

    chapters:[
      {
        title:"第一章",
        text:""
      }
    ],

    settings:{
      fontSize:18,
      lineHeight:1.9,
      letterSpacing:.08,
      fontFamily:
        '"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif'
    }

  };

}


function normalizeState(parsed){

  const fallback =
    createDefaultState();

  if(
    !parsed ||
    !Array.isArray(parsed.chapters) ||
    parsed.chapters.length === 0
  ){
    return fallback;
  }

  const normalized = {

    title:
      typeof parsed.title === "string"
        ? parsed.title
        : fallback.title,

    activeChapter:
      Number.isInteger(parsed.activeChapter)
        ? parsed.activeChapter
        : 0,

    chapters:
      parsed.chapters.map(
        (chapter,index)=>({

          title:
            typeof chapter.title === "string" &&
            chapter.title.trim()
              ? chapter.title
              : `第${index + 1}章`,

          text:
            typeof chapter.text === "string"
              ? chapter.text
              : ""

        })
      ),

    settings:{
      ...fallback.settings,
      ...(parsed.settings || {})
    }

  };

  normalized.activeChapter =
    Math.max(
      0,
      Math.min(
        normalized.activeChapter,
        normalized.chapters.length - 1
      )
    );

  return normalized;

}


function loadState(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw){
      return createDefaultState();
    }

    return normalizeState(
      JSON.parse(raw)
    );

  }catch(error){

    console.warn(
      "保存データの読み込みに失敗しました。",
      error
    );

    return createDefaultState();

  }

}


let state =
  loadState();


let saveTimer = null;


/* =========================================================
   ANIMATION STATE
========================================================= */

let animationTimer = null;

let displayedPreviewText = "";

let animationToken = 0;


/* =========================================================
   READER STATE
========================================================= */

let isDragging = false;

let dragStartX = 0;

let dragStartScrollLeft = 0;

let touchStartX = 0;

let touchStartScrollLeft = 0;

let suppressClick = false;


/* =========================================================
   UTILITY
========================================================= */

function characterLength(text){

  return [...text].length;

}


function escapeHtml(text){

  return text.replace(
    /[&<>"']/g,
    char=>{

      const map = {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      };

      return map[char];

    }
  );

}


function currentChapter(){

  return state.chapters[
    state.activeChapter
  ];

}


function syncEditor(){

  const chapter =
    currentChapter();

  if(!chapter){
    return;
  }

  chapter.text =
    $("editor").value;

}


/* =========================================================
   READER SCROLL
========================================================= */

function getReaderViewport(){

  return $("readerViewport");

}


function scrollReaderBy(amount){

  const viewport =
    getReaderViewport();

  viewport.scrollBy({
    left:amount,
    behavior:"smooth"
  });

}


function scrollReaderToStart(){

  const viewport =
    getReaderViewport();

  /*
    RTL / vertical writingでは
    ブラウザごとにscrollLeftの初期値が
    やや面倒なので、右端へ移動する。
  */

  viewport.scrollLeft =
    viewport.scrollWidth;

}


function updateReaderPosition(){

  const viewport =
    getReaderViewport();

  const max =
    Math.max(
      1,
      viewport.scrollWidth -
      viewport.clientWidth
    );

  /*
    右端を0%
    左端を100%
    として読書位置を表示。
  */

  const position =
    Math.round(
      (
        (viewport.scrollWidth -
          viewport.clientWidth -
          viewport.scrollLeft)
        /
        max
      ) * 100
    );

  $("readerControlLabel").textContent =
    `${Math.max(0,Math.min(100,position))}%`;

}


/* =========================================================
   READER POINTER DRAG
========================================================= */

const readerViewport =
  $("readerViewport");


readerViewport.addEventListener(
  "pointerdown",
  event=>{

    if(event.button !== 0){
      return;
    }

    /*
      ボタンなどを掴んだ場合は無視。
    */

    if(
      event.target.closest(
        "button"
      )
    ){
      return;
    }

    isDragging = true;

    dragStartX =
      event.clientX;

    dragStartScrollLeft =
      readerViewport.scrollLeft;

    readerViewport.classList.add(
      "dragging"
    );

    readerViewport.setPointerCapture(
      event.pointerId
    );

  }
);


readerViewport.addEventListener(
  "pointermove",
  event=>{

    if(!isDragging){
      return;
    }

    const distance =
      event.clientX -
      dragStartX;

    if(Math.abs(distance) > 4){
      suppressClick = true;
    }

    readerViewport.scrollLeft =
      dragStartScrollLeft -
      distance;

  }
);


function finishPointerDrag(){

  if(!isDragging){
    return;
  }

  isDragging = false;

  readerViewport.classList.remove(
    "dragging"
  );

  setTimeout(
    ()=>{
      suppressClick = false;
    },
    80
  );

}


readerViewport.addEventListener(
  "pointerup",
  finishPointerDrag
);

readerViewport.addEventListener(
  "pointercancel",
  finishPointerDrag
);


/* =========================================================
   TOUCH SWIPE
========================================================= */

readerViewport.addEventListener(
  "touchstart",
  event=>{

    if(!event.touches.length){
      return;
    }

    touchStartX =
      event.touches[0].clientX;

    touchStartScrollLeft =
      readerViewport.scrollLeft;

  },
  {
    passive:true
  }
);


readerViewport.addEventListener(
  "touchmove",
  event=>{

    if(!event.touches.length){
      return;
    }

    const distance =
      event.touches[0].clientX -
      touchStartX;

    readerViewport.scrollLeft =
      touchStartScrollLeft -
      distance;

  },
  {
    passive:true
  }
);


/* =========================================================
   WHEEL -> HORIZONTAL
========================================================= */

readerViewport.addEventListener(
  "wheel",
  event=>{

    /*
      縦書き読書では、
      通常ホイールを横移動として扱う。

      Shiftホイールや
      トラックパッドのdeltaXも考慮。
    */

    const horizontal =
      event.deltaX;

    const vertical =
      event.deltaY;

    const amount =
      Math.abs(horizontal) >
      Math.abs(vertical)
        ? horizontal
        : vertical;

    if(amount === 0){
      return;
    }

    event.preventDefault();

    readerViewport.scrollLeft +=
      amount;

    updateReaderPosition();

  },
  {
    passive:false
  }
);


/* =========================================================
   KEYBOARD READER
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    /*
      textarea入力中の左右キーは
      読書スクロールに奪わない。
    */

    const tag =
      document.activeElement?.tagName;

    if(
      tag === "TEXTAREA" ||
      tag === "INPUT" ||
      tag === "SELECT"
    ){
      return;
    }

    if(
      document.body.classList.contains(
        "reading-mode"
      ) ||
      $("reader").classList.contains(
        "mobile-preview"
      )
    ){

      if(event.key === "ArrowLeft"){

        event.preventDefault();

        scrollReaderBy(
          -Math.max(
            300,
            readerViewport.clientWidth * .75
          )
        );

      }

      if(event.key === "ArrowRight"){

        event.preventDefault();

        scrollReaderBy(
          Math.max(
            300,
            readerViewport.clientWidth * .75
          )
        );

      }

      if(event.key === "Home"){

        event.preventDefault();

        scrollReaderToStart();

      }

      if(event.key === "End"){

        event.preventDefault();

        readerViewport.scrollLeft = 0;

      }

    }

  }
);


/* =========================================================
   READER BUTTONS
========================================================= */

$("readerPrev").addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    scrollReaderBy(
      -Math.max(
        350,
        readerViewport.clientWidth * .75
      )
    );

  }
);


$("readerNext").addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    scrollReaderBy(
      Math.max(
        350,
        readerViewport.clientWidth * .75
      )
    );

  }
);


readerViewport.addEventListener(
  "scroll",
  ()=>{
    updateReaderPosition();
  },
  {
    passive:true
  }
);


/* =========================================================
   PREVIEW WIDTH CALCULATION
========================================================= */

/*
  縦書きでは本文が増えると列が左方向へ増える。

  scrollWidthを確実に発生させるため、
  実際に描画された本文のbounding boxを測り、
  原稿面の幅を必要量まで拡張する。
*/

function updateReaderCanvasWidth(){

  const canvas =
    $("readerCanvas");

  const book =
    document.querySelector(
      ".book"
    );

  const stage =
    $("verticalStage");

  const preview =
    $("preview");

  if(
    !canvas ||
    !book ||
    !stage ||
    !preview
  ){
    return;
  }

  const text =
    currentChapter()?.text || "";

  const viewport =
    getReaderViewport();

  const viewportWidth =
    Math.max(
      1,
      viewport.clientWidth
    );

  /*
    空本文でも最低限の紙幅を確保。
  */

  if(!text){

    preview.classList.add(
      "empty"
    );

    book.style.width =
      `${viewportWidth}px`;

    canvas.style.width =
      `${viewportWidth}px`;

    return;

  }

  preview.classList.remove(
    "empty"
  );

  /*
    vertical-rl の実描画幅を取得。
  */

  const rect =
    preview.getBoundingClientRect();

  const stageRect =
    stage.getBoundingClientRect();

  /*
    本文の左端がステージ左端から
    どれだけ外へ出ているかを見る。
  */

  const requiredTextWidth =
    Math.max(
      rect.width,
      stage.clientWidth
    );

  /*
    余白を追加。
  */

  const horizontalPadding =
    120;

  const bookWidth =
    Math.max(
      viewportWidth,
      220 +
      requiredTextWidth +
      horizontalPadding
    );

  book.style.width =
    `${Math.ceil(bookWidth)}px`;

  canvas.style.width =
    `${Math.ceil(bookWidth)}px`;

}


/* =========================================================
   AUTO FOLLOW
========================================================= */

function followLatestText(){

  const viewport =
    getReaderViewport();

  /*
    執筆中は右端を起点にする。
  */

  viewport.scrollLeft =
    viewport.scrollWidth;

  updateReaderPosition();

}


/* =========================================================
   ANIMATION SPEED
========================================================= */

function getAnimationSpeed(
  addedLength
){

  if(addedLength <= 5){
    return 28;
  }

  if(addedLength <= 20){
    return 18;
  }

  if(addedLength <= 80){
    return 7;
  }

  if(addedLength <= 300){
    return 2;
  }

  return 0;

}


/* =========================================================
   PREVIEW RENDER
========================================================= */

function setPreviewTextImmediate(
  text
){

  const preview =
    $("preview");

  clearTimeout(
    animationTimer
  );

  animationToken++;

  displayedPreviewText =
    text;

  preview.textContent =
    text;

  if(text){
    preview.classList.remove(
      "empty"
    );
  }else{
    preview.classList.add(
      "empty"
    );
  }

  requestAnimationFrame(
    ()=>{
      updateReaderCanvasWidth();
      updateReaderPosition();
    }
  );

}


function animatePreview(
  newText
){

  clearTimeout(
    animationTimer
  );

  const token =
    ++animationToken;

  const preview =
    $("preview");

  /*
    普通の追加入力だけアニメーション。
  */

  if(
    newText.startsWith(
      displayedPreviewText
    ) &&
    newText.length >
    displayedPreviewText.length
  ){

    const oldText =
      displayedPreviewText;

    const addedText =
      newText.slice(
        oldText.length
      );

    const characters =
      [...addedText];

    const speed =
      getAnimationSpeed(
        characters.length
      );

    /*
      長文貼り付けなら即時表示。
    */

    if(speed === 0){

      setPreviewTextImmediate(
        newText
      );

      followLatestText();

      return;

    }

    preview.textContent =
      oldText;

    preview.classList.remove(
      "empty"
    );

    let index = 0;

    function typeNext(){

      if(
        token !== animationToken
      ){
        return;
      }

      if(
        index >=
        characters.length
      ){

        preview.textContent =
          newText;

        displayedPreviewText =
          newText;

        updateReaderCanvasWidth();

        followLatestText();

        return;

      }

      preview.textContent =
        oldText +
        characters
          .slice(
            0,
            index + 1
          )
          .join("");

      index++;

      updateReaderCanvasWidth();

      followLatestText();

      animationTimer =
        setTimeout(
          typeNext,
          speed
        );

    }

    typeNext();

    return;

  }

  /*
    削除・途中編集・章変更など。
  */

  setPreviewTextImmediate(
    newText
  );

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

  const chapter =
    currentChapter();

  if(!chapter){
    return;
  }

  const text =
    chapter.text;

  $("characterCount").textContent =
    characterLength(
      text
    ).toLocaleString() +
    "字";

  $("lineCount").textContent =
    (
      text
        ? text.split("\n").length
        : 0
    ).toLocaleString() +
    "行";

  $("bookMeta").textContent =
    chapter.title +
    "　" +
    characterLength(
      text
    ).toLocaleString() +
    "字";

  $("previewChapter").textContent =
    chapter.title;

  const total =
    state.chapters.reduce(
      (sum,item)=>
        sum +
        characterLength(
          item.text
        ),
      0
    );

  $("totalCharacters").textContent =
    total.toLocaleString() +
    "字";

}


/* =========================================================
   RENDER CHAPTERS
========================================================= */

function renderChapters(){

  const container =
    $("chapters");

  container.innerHTML =
    "";

  const fragment =
    document.createDocumentFragment();

  state.chapters.forEach(
    (chapter,index)=>{

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "chapter" +
        (
          index ===
          state.activeChapter
            ? " active"
            : ""
        );

      const titleRow =
        document.createElement(
          "div"
        );

      titleRow.className =
        "chapter-title-row";

      const title =
        document.createElement(
          "span"
        );

      title.className =
        "chapter-title";

      title.textContent =
        chapter.title;

      titleRow.appendChild(
        title
      );

      const small =
        document.createElement(
          "small"
        );

      small.textContent =
        characterLength(
          chapter.text
        ).toLocaleString() +
        "字";

      button.appendChild(
        titleRow
      );

      button.appendChild(
        small
      );

      button.addEventListener(
        "click",
        ()=>{
          switchChapter(index);
        }
      );

      fragment.appendChild(
        button
      );

    }
  );

  container.appendChild(
    fragment
  );

  $("chapterCount").textContent =
    state.chapters.length;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  syncEditor();

  const chapter =
    currentChapter();

  if(!chapter){
    return;
  }

  $("titleInput").value =
    state.title;

  $("bookTitle").textContent =
    state.title;

  $("editor").value =
    chapter.text;

  updateStats();

  renderChapters();

  applySettings();

  setPreviewTextImmediate(
    chapter.text
  );

}


/* =========================================================
   SWITCH CHAPTER
========================================================= */

function switchChapter(
  index
){

  if(
    index < 0 ||
    index >= state.chapters.length
  ){
    return;
  }

  clearTimeout(
    animationTimer
  );

  animationToken++;

  syncEditor();

  state.activeChapter =
    index;

  const chapter =
    currentChapter();

  $("editor").value =
    chapter.text;

  displayedPreviewText =
    chapter.text;

  $("preview").textContent =
    chapter.text;

  $("previewChapter").textContent =
    chapter.title;

  updateStats();

  renderChapters();

  requestAnimationFrame(
    ()=>{
      updateReaderCanvasWidth();
      followLatestText();
    }
  );

  scheduleSave();

}


/* =========================================================
   AUTO SAVE
========================================================= */

function scheduleSave(){

  clearTimeout(
    saveTimer
  );

  $("saveState").textContent =
    "保存中…";

  $("status").textContent =
    "編集中";

  saveTimer =
    setTimeout(
      saveState,
      500
    );

}


function saveState(){

  clearTimeout(
    saveTimer
  );

  syncEditor();

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        state
      )
    );

    $("saveState").textContent =
      "保存済み";

    $("status").textContent =
      "保存しました";

  }catch(error){

    console.error(error);

    $("saveState").textContent =
      "保存失敗";

    $("status").textContent =
      "保存できませんでした";

  }

}


/* =========================================================
   MANUAL SAVE
========================================================= */

$("saveButton").addEventListener(
  "click",
  ()=>{
    saveState();
  }
);


/* =========================================================
   EDITOR INPUT
========================================================= */

$("editor").addEventListener(
  "input",
  ()=>{

    syncEditor();

    const text =
      currentChapter().text;

    animatePreview(
      text
    );

    updateStats();

    renderChapters();

    scheduleSave();

  }
);


/* =========================================================
   TITLE
========================================================= */

$("titleInput").addEventListener(
  "input",
  event=>{

    state.title =
      event.target.value ||
      "新しい物語";

    $("bookTitle").textContent =
      state.title;

    scheduleSave();

  }
);


/* =========================================================
   SETTINGS
========================================================= */

function applySettings(){

  const settings =
    state.settings;

  const preview =
    $("preview");

  preview.style.fontSize =
    settings.fontSize +
    "px";

  preview.style.lineHeight =
    settings.lineHeight;

  preview.style.letterSpacing =
    settings.letterSpacing +
    "em";

  preview.style.fontFamily =
    settings.fontFamily;

  requestAnimationFrame(
    ()=>{
      updateReaderCanvasWidth();
    }
  );

}


function openSettings(){

  const settings =
    state.settings;

  $("fontSize").value =
    settings.fontSize;

  $("lineHeight").value =
    settings.lineHeight;

  $("letterSpacing").value =
    settings.letterSpacing;

  $("fontFamily").value =
    settings.fontFamily;

  $("settingsModal")
    .classList
    .add("open");

}


$("settingsButton").addEventListener(
  "click",
  openSettings
);


$("closeSettings").addEventListener(
  "click",
  ()=>{
    $("settingsModal")
      .classList
      .remove("open");
  }
);


$("fontSize").addEventListener(
  "input",
  event=>{

    const value =
      Number(
        event.target.value
      );

    if(
      !Number.isFinite(value)
    ){
      return;
    }

    state.settings.fontSize =
      Math.max(
        12,
        Math.min(
          40,
          value
        )
      );

    applySettings();

    scheduleSave();

  }
);


$("lineHeight").addEventListener(
  "input",
  event=>{

    const value =
      Number(
        event.target.value
      );

    if(
      !Number.isFinite(value)
    ){
      return;
    }

    state.settings.lineHeight =
      Math.max(
        1,
        Math.min(
          3,
          value
        )
      );

    applySettings();

    scheduleSave();

  }
);


$("letterSpacing").addEventListener(
  "input",
  event=>{

    const value =
      Number(
        event.target.value
      );

    if(
      !Number.isFinite(value)
    ){
      return;
    }

    state.settings.letterSpacing =
      Math.max(
        0,
        Math.min(
          .5,
          value
        )
      );

    applySettings();

    scheduleSave();

  }
);


$("fontFamily").addEventListener(
  "change",
  event=>{

    state.settings.fontFamily =
      event.target.value;

    applySettings();

    scheduleSave();

  }
);


/* =========================================================
   NEW WORK
========================================================= */

$("newButton").addEventListener(
  "click",
  ()=>{

    $("newTitle").value =
      "新しい物語";

    $("newModal")
      .classList
      .add("open");

    requestAnimationFrame(

        $("newTitle").select();
      }
    );

  }
);


$("cancelNew").addEventListener(
  "click",
  ()=>{
    $("newModal")
      .classList
      .remove("open");
  }
);


$("createNew").addEventListener(
  "click",
  ()=>{

    clearTimeout(
      animationTimer
    );

    animationToken++;

    state =
      createDefaultState();

    state.title =
      $("newTitle").value.trim() ||
      "新しい物語";

    $("newModal")
      .classList
      .remove("open");

    $("editor").value =
      "";

    displayedPreviewText =

    $("preview").textContent =

  }

/* =========================================================
   ADD CHAPTER
========================================================= */

$("addChapter").addEventListener(
  "click",
  ()=>{

    clearTimeout(
      animationTimer
    );

    animationToken++;

    syncEditor();

    const number =
      state.chapters.length + 1;

    state.chapters.push({

      title:
        "第" +
        number +
        "章",

      text:""

    });

    state.activeChapter =
      state.chapters.length - 1;

    $("editor").value =
      "";

    displayedPreviewText =
      "";

    $("preview").textContent =
      "";

    render();

    scheduleSave();

    $("editor").focus();

  }
);


/* =========================================================
   RENAME CHAPTER
========================================================= */

$("renameChapter").addEventListener(
  "click",
  ()=>{

    const chapter =
      currentChapter();

    if(!chapter){
      return;
    }

    $("chapterTitleInput").value =
      chapter.title;

    $("chapterModal")
      .classList
      .add("open");

    requestAnimationFrame(
      ()=>{
        $("chapterTitleInput").focus();
        $("chapterTitleInput").select();
      }
    );

  }
);


$("cancelChapter").addEventListener(
  "click",
  ()=>{
    $("chapterModal")
      .classList
      .remove("open");
  }
);


$("saveChapterTitle").addEventListener(
  "click",
  ()=>{

    const value =
      $("chapterTitleInput")
        .value
        .trim();

    if(!value){
      return;
    }

    currentChapter().title =
      value;

    $("chapterModal")
      .classList
      .remove("open");

    updateStats();

    renderChapters();

    scheduleSave();

  }
);


/* =========================================================
   DELETE CHAPTER
========================================================= */

$("deleteChapter").addEventListener(
  "click",
  ()=>{

    if(
      state.chapters.length <= 1
    ){

      alert(
        "最後の1章は削除できません。"
      );

      return;

    }

    const chapter =
      currentChapter();

    const ok =
      confirm(
        `「${chapter.title}」を削除しますか？\n本文も削除されます。`
      );

    if(!ok){
      return;
    }

    state.chapters.splice(
      state.activeChapter,
      1
    );

    state.activeChapter =
      Math.max(
        0,
        Math.min(
          state.activeChapter,
          state.chapters.length - 1
        )
      );

    const next =
      currentChapter();

    $("editor").value =
      next.text;

    displayedPreviewText =
      next.text;

    $("preview").textContent =
      next.text;

    render();

    scheduleSave();

  }
);


/* =========================================================
   MODE
========================================================= */

function enterReadingMode(){

  syncEditor();

  /*
    読書モードではreader自体を
    画面いっぱいに固定。
  */

  document.body.classList.add(
    "reading-mode"
  );

  $("reader")
    .classList
    .add("reading");

  $("readingMode")
    .classList
    .add("active");

  $("writeMode")
    .classList
    .remove("active");

  $("mobilePreview")
    .classList
    .remove("active");

  requestAnimationFrame(
    ()=>{
      updateReaderCanvasWidth();
      followLatestText();
    }
  );

}


function enterWriteMode(){

  document.body.classList.remove(
    "reading-mode"
  );

  $("reader")
    .classList
    .remove("reading");

  $("reader")
    .classList
    .remove("mobile-preview");

  $("writeMode")
    .classList
    .add("active");

  $("readingMode")
    .classList
    .remove("active");

  $("mobilePreview")
    .classList
    .remove("active");

}


$("readingMode").addEventListener(
  "click",
  ()=>{
    enterReadingMode();
  }
);


$("writeMode").addEventListener(
  "click",
  ()=>{
    enterWriteMode();
  }
);


$("readingBack").addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    enterWriteMode();

  }
);


/* =========================================================
   MOBILE PREVIEW
========================================================= */

$("mobilePreview").addEventListener(
  "click",
  ()=>{

    const reader =
      $("reader");

    const active =
      reader.classList.toggle(
        "mobile-preview"
      );

    $("mobilePreview")
      .classList
      .toggle(
        "active",
        active
      );

    if(active){

      requestAnimationFrame(
        ()=>{
          updateReaderCanvasWidth();
          followLatestText();
        }
      );

    }

  }
);


/* =========================================================
   EXPORT
========================================================= */

function downloadFile(
  filename,
  content,
  mime
){

  const blob =
    new Blob(
      [content],
      {
        type:mime
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const link =
    document.createElement(
      "a"
    );

  link.href =
    url;

  link.download =
    filename;

  document.body.appendChild(
    link
  );

  link.click();

  link.remove();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );

}


/* =========================================================

/* =========================================================
   MODAL / ESCAPE
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() === "s"
    ){

      event.preventDefault();

      saveState();

      return;

    }

    if(
      event.key === "Escape"
    ){

      document
        .querySelectorAll(
          ".modal-bg.open"
        )
        .forEach(
          modal=>{
            modal.classList.remove(
              "open"
            );
          }
        );

      /*
        読書モード中にEscでも執筆へ戻る。
      */

      if(
        document.body.classList.contains(
          "reading-mode"
        )
      ){

        enterWriteMode();

      }

    }

  }
);
