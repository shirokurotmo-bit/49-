<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>縦読み小説エディタ PRO</title>

<style>
:root{
  --bg:#0b0d10;
  --panel:#11151a;
  --panel2:#171c22;
  --line:#2b333d;
  --text:#edf1f5;
  --muted:#8d98a5;
  --accent:#9abfff;
  --paper:#f7f3ea;
  --ink:#252525;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,"Noto Sans JP",sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  height:100dvh;
  display:grid;
  grid-template-rows:58px minmax(0,1fr) 30px;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 16px;
  background:rgba(17,21,26,.98);
  border-bottom:1px solid var(--line);
  z-index:80;
}

.brand{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
}

.brand span{
  color:var(--accent);
}

.title-input{
  width:min(360px,35vw);
  padding:7px 0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:15px;
  font-weight:700;
}

.header-actions{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.btn,
.tool{
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 11px;
  background:var(--panel2);
  color:var(--text);
}

.btn:hover,
.tool:hover{
  background:#1d242c;
}

.btn-primary{
  background:#dce9ff;
  border-color:#dce9ff;
  color:#182237;
  font-weight:700;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);
}

/* =========================================================
   READER
========================================================= */

.reader{
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-rows:46px minmax(0,1fr);
  background:#d9d5cc;
  border-right:1px solid var(--line);
  overflow:hidden;
}

.reader-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(247,243,234,.96);
  color:#444;
  border-bottom:1px solid #c9c2b7;
  z-index:10;
}

.reader-header strong{
  font-size:13px;
}

.reader-header span{
  color:#777;
  font-size:11px;
}

.reader-viewport{
  min-width:0;
  min-height:0;
  overflow:auto;

  padding:28px;

  direction:ltr;

  overscroll-behavior:contain;

  scrollbar-width:thin;
}

/*
  本文を「画面に収まる高さ」に固定する。

  以前は width:100% + min-height:65% だったため、
  長文になるほど横方向へ巨大化しやすかった。
*/

.book{
  min-height:calc(100% - 10px);

  width:max-content;
  min-width:100%;

  background:var(--paper);
  color:var(--ink);

  padding:48px 58px;

  box-shadow:0 18px 55px rgba(0,0,0,.22);

  display:flex;
  flex-direction:column;
  align-items:flex-end;

  position:relative;
}

.book-title{
  writing-mode:vertical-rl;
  text-orientation:mixed;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  font-size:30px;
  font-weight:700;
  line-height:1.8;

  align-self:flex-start;

  margin-bottom:26px;

  white-space:nowrap;
}

.book-meta{
  align-self:flex-start;

  color:#777;
  font-size:12px;

  margin-bottom:18px;

  white-space:nowrap;
}

/*
  重要変更。

  heightを固定することで、
  縦書きの1列が画面外へ無限に伸びることを防ぐ。

  writing-mode:vertical-rl により、
  文章が下へ進み、列が右から左へ増える。
*/

.vertical-text{
  writing-mode:vertical-rl;
  text-orientation:mixed;
  direction:ltr;

  white-space:pre-wrap;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  font-size:18px;
  line-height:1.9;
  letter-spacing:.08em;

  height:calc(100dvh - 210px);

  width:max-content;

  min-width:0;

  overflow:visible;
}

/* =========================================================
   文字アニメーション
========================================================= */

.novel-char{
  display:inline;
  opacity:1;
}

.novel-char.typing{
  animation:
    novelCharacterIn
    .18s
    cubic-bezier(.2,.75,.25,1)
    both;
}

@keyframes novelCharacterIn{
  0%{
    opacity:0;
    filter:blur(3px);
  }

  45%{
    opacity:.55;
    filter:blur(1px);
  }

  100%{
    opacity:1;
    filter:blur(0);
  }
}

.novel-char.latest{
  animation:
    novelLatest
    .28s
    ease-out
    both;
}

@keyframes novelLatest{
  0%{
    opacity:.15;
    text-shadow:0 0 8px rgba(60,50,35,.25);
  }

  100%{
    opacity:1;
    text-shadow:none;
  }
}

/* =========================================================
   READING MODE CONTROLS
========================================================= */

.reading-controls{
  position:absolute;

  right:22px;
  bottom:22px;

  display:none;

  align-items:center;
  gap:8px;

  z-index:70;
}

.reader.reading .reading-controls{
  display:flex;
}

.reader.reading .reader-viewport{
  padding:0;
}

.reader.reading .book{
  min-height:100%;
  padding:55px 90px;
  box-shadow:none;
  border-radius:0;
}

.reader.reading .vertical-text{
  height:calc(100dvh - 170px);
}

/* ページ送りUI */

.page-button{
  width:42px;
  height:42px;

  border:1px solid #c9c2b7;
  border-radius:50%;

  background:rgba(247,243,234,.92);
  color:#3d3a35;

  display:grid;
  place-items:center;

  font-size:18px;

  box-shadow:0 5px 20px rgba(0,0,0,.16);

  transition:
    transform .15s ease,
    background .15s ease;
}

.page-button:hover{
  background:#fff;
  transform:translateY(-1px);
}

.page-button:active{
  transform:scale(.94);
}

.reading-exit{
  border-radius:9px;

  padding:10px 14px;

  border:1px solid #c9c2b7;

  background:rgba(247,243,234,.95);
  color:#333;

  font-size:12px;
  font-weight:700;

  box-shadow:0 5px 20px rgba(0,0,0,.16);
}

.reading-exit:hover{
  background:#fff;
}

.page-indicator{
  min-width:70px;

  padding:8px 10px;

  border-radius:8px;

  background:rgba(247,243,234,.9);
  color:#555;

  text-align:center;

  font-size:11px;

  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

/* =========================================================
   WRITER
========================================================= */

.writer{
  min-width:0;
  min-height:0;

  background:var(--panel);

  display:grid;
  grid-template-rows:50px minmax(0,1fr);
}

.toolbar{
  display:flex;
  align-items:center;
  gap:6px;

  padding:0 10px;

  border-bottom:1px solid var(--line);

  overflow:auto;
}

.tool{
  background:transparent;
  border-color:transparent;
  color:var(--muted);
  white-space:nowrap;
}

.tool.active,
.tool:hover{
  background:#1b222a;
  border-color:var(--line);
  color:var(--text);
}

/* =========================================================
   EDITOR
========================================================= */

.editor-area{
  min-height:0;

  display:grid;
  grid-template-columns:190px minmax(0,1fr);
}

.chapter-list{
  min-height:0;
  overflow:auto;

  padding:10px;

  border-right:1px solid var(--line);
}

.chapter-list-header{
  padding:5px 6px 9px;

  color:var(--muted);
  font-size:12px;
}

.chapter{
  width:100%;
  display:block;

  margin-bottom:5px;
  padding:10px;

  border:1px solid transparent;
  border-radius:8px;

  background:transparent;
  color:#b7c0ca;

  text-align:left;
}

.chapter:hover{
  background:#191f26;
}

.chapter.active{
  background:#202833;
  border-color:#364251;
  color:#fff;
}

.chapter small{
  display:block;
  margin-top:4px;

  color:#7e8996;
  font-size:10px;
}

.editor-wrapper{
  min-width:0;
  min-height:0;

  position:relative;
}

#editor{
  width:100%;
  height:100%;

  resize:none;

  border:0;
  outline:0;

  padding:30px 32px 80px;

  background:#101419;
  color:#edf1f5;

  font-size:17px;
  line-height:1.95;
  letter-spacing:.02em;

  overflow:auto;
}

#editor::selection{
  background:#405f85;
  color:#fff;
}

.editor-info{
  position:absolute;

  right:14px;
  bottom:12px;

  padding:5px 8px;

  border-radius:6px;

  background:rgba(16,20,25,.9);

  color:#7f8995;
  font-size:11px;

  pointer-events:none;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  display:flex;
  align-items:center;

  padding:0 12px;

  border-top:1px solid var(--line);

  color:var(--muted);
  font-size:11px;
}

.status{
  margin-left:auto;
}

/* =========================================================
   MODAL
========================================================= */

.modal-bg{
  position:fixed;
  inset:0;

  display:none;
  place-items:center;

  background:rgba(0,0,0,.62);

  z-index:100;
}

.modal-bg.open{
  display:grid;
}

.modal{
  width:min(540px,92vw);

  padding:20px;

  border:1px solid var(--line);
  border-radius:13px;

  background:#161b21;

  box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.modal h2{
  margin:0 0 16px;
  font-size:18px;
}

.field{
  display:grid;
  gap:6px;
  margin-bottom:12px;
}

.field label{
  color:var(--muted);
  font-size:12px;
}

.field input,
.field select{
  width:100%;

  padding:9px;

  border:1px solid var(--line);
  border-radius:7px;

  outline:0;

  background:#0e1216;
  color:var(--text);
}

.field-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;

  margin-top:16px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .workspace{
    grid-template-columns:1fr;
  }

  .reader{
    display:none;
  }

  .reader.mobile-preview{
    display:grid;

    position:fixed;

    inset:58px 0 30px;

    z-index:50;

    border:0;
  }

  .reader.mobile-preview .vertical-text{
    height:calc(100dvh - 150px);
  }

  .editor-area{
    grid-template-columns:145px minmax(0,1fr);
  }
}

@media(max-width:620px){

  .topbar{
    padding:0 10px;
    gap:8px;
  }

  .brand{
    font-size:13px;
  }

  .title-input{
    width:30vw;
    font-size:13px;
  }

  .header-actions .secondary{
    display:none;
  }

  .editor-area{
    grid-template-columns:1fr;
  }

  .chapter-list{
    display:none;
  }

  #editor{
    padding:20px 17px 70px;
    font-size:16px;
  }

  .reader-viewport{
    padding:15px;
  }

  .book{
    padding:28px 24px;
  }

  .book-title{
    font-size:25px;
  }

  .reader.reading .book{
    padding:35px 45px;
  }

  .reading-controls{
    right:12px;
    bottom:12px;
    gap:5px;
  }

  .page-button{
    width:38px;
    height:38px;
  }

  .page-indicator{
    min-width:58px;
  }

  .reading-exit{
    padding:9px 10px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

  <div class="brand">
    縦読み小説 <span>PRO</span>
  </div>

  <input
    id="titleInput"
    class="title-input"
    value="新しい物語"
    placeholder="作品タイトル"
  >

  <div class="header-actions">

    <button class="btn secondary" id="newButton">
      新規
    </button>

    <button class="btn secondary" id="settingsButton">
      設定
    </button>

    <button class="btn btn-primary" id="saveButton">
      保存
    </button>

  </div>

</header>


<main class="workspace">

<section id="reader" class="reader">

  <div class="reader-header">

    <strong>
      完成プレビュー
    </strong>

    <span id="totalCharacters">
      0字
    </span>

  </div>


  <div
    class="reader-viewport"
    id="readerViewport"
  >

    <article class="book">

      <div
        id="bookTitle"
        class="book-title"
      ></div>

      <div
        id="bookMeta"
        class="book-meta"
      ></div>

      <div
        id="preview"
        class="vertical-text"
      ></div>

    </article>

  </div>


  <!-- 読書モード専用操作 -->

  <div class="reading-controls">

    <button
      class="page-button"
      id="pagePrev"
      title="前へ"
    >
      ←
    </button>

    <div
      class="page-indicator"
      id="pageIndicator"
    >
      1 / 1

    <button
      class="page-button"
      id="pageNext"
      title="次へ"
    >
      →
    </button>

    <button
      class="reading-exit"
      id="exitReading"
    >
      執筆に戻る
    </button>

  </div>

</section>


<section class="writer">

  <div class="toolbar">

    <button
      id="writeMode"
      class="tool active"
    >
      執筆
    </button>

    <button
      id="readingMode"
      class="tool"
    >
      読書
    </button>

    <button
      id="mobilePreview"
      class="tool"
    >
      プレビュー
    </button>

    <button
      id="addChapter"
      class="tool"
    >
      ＋章
    </button>

    <button
      id="exportTxt"
      class="tool"
    >
      TXT
    </button>

    <button
      id="exportHtml"
      class="tool"
    >
      HTML
    </button>

  </div>


  <div class="editor-area">

    <aside class="chapter-list">

      <div class="chapter-list-header">
        章
        <span id="chapterCount">1</span>
      </div>

      <div id="chapters"></div>

    </aside>


    <div class="editor-wrapper">

      <textarea
        id="editor"
        spellcheck="false"
        placeholder="ここに小説を書いてください。入力した文章は左側にリアルタイムで綴られていきます。"
      ></textarea>


      <div class="editor-info">

        <span id="characterCount">
          0字
        </span>

        <span>　</span>

        <span id="lineCount">

        <span>　</span>

        <span id="saveState">

        </span>

</section>

</main>


<footer class="footer">

  <span>
    右端から左方向へ流れる縦書き
  </span>

  <span
    class="status"
    id="status"
  >
    準備完了
  </span>

</footer>

</div>


<!-- SETTINGS -->

<div
  id="settingsModal"
  class="modal-bg"
>

  <div class="modal">

    <h2>
      表示設定
    </h2>


    <div class="field-row">

      <div class="field">

        <label>
          文字サイズ
        </label>

        <input
          id="fontSize"
          type="number"
          min="12"
          max="40"
        >

      </div>


      <div class="field">

        <label>
          行間
        </label>

        <input
          id="lineHeight"
          type="number"
          min="1"
          max="3"
          step=".05"
        >

      </div>

    </div>


    <div class="field-row">

      <div class="field">

        <label>
          字間
        </label>

        <input
          id="letterSpacing"
          type="number"
          min="0"
          max=".5"
          step=".01"
        >

      </div>


      <div class="field">

        <label>
          書体
        </label>

        <select id="fontFamily">

          <option value='"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif'>
            明朝
          </option>

          <option value='"Noto Sans JP",system-ui,sans-serif'>

          </option>

        </select>

      </div>

    </div>


    <div class="modal-actions">

      <button
        class="btn"
        id="closeSettings"
      >
        閉じる
      </button>

    </div>

  </div>

</div>


<!-- NEW WORK -->

<div
  id="newModal"
  class="modal-bg"
>

  <div class="modal">

    <h2>
      新しい作品
    </h2>

    <div class="field">

      <label>
        作品タイトル
      </label>

      <input
        id="newTitle"
        value="新しい物語"
      >

    </div>


    <div class="modal-actions">

      <button
        class="btn"
        id="cancelNew"
      >
        キャンセル
      </button>

      <button
        class="btn btn-primary"
        id="createNew"
      >
        作成
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   STATE
========================================================= */

const STORAGE_KEY =
  "vertical-novel-pro-animation-v2";


const $ = id =>
  document.getElementById(id);


function createDefaultState(){

  return {

    title:"新しい物語",

    activeChapter:0,

    chapters:[
      {
        title:"第一章",
        text:""
      }
    ],

    settings:{

      fontSize:18,

      lineHeight:1.9,

      letterSpacing:.08,

      fontFamily:
        '"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif'

    }

  };

}


function loadState(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw){
      return createDefaultState();
    }

    const parsed =
      JSON.parse(raw);

    if(
      !parsed ||
      !Array.isArray(parsed.chapters) ||
      parsed.chapters.length === 0
    ){

      return createDefaultState();

    }

    if(!parsed.settings){

      parsed.settings =
        createDefaultState().settings;

    }

    return parsed;

  }catch{

    return createDefaultState();

  }

}


let state =
  loadState();


let saveTimer = null;


/* =========================================================
   ANIMATION
========================================================= */

let animationTimer = null;

let displayedPreviewText = "";

let animationToken = 0;


function getAnimationSpeed(
  addedLength
){

  if(addedLength <= 5){
    return 28;
  }

  if(addedLength <= 20){
    return 18;
  }

  if(addedLength <= 80){
    return 7;
  }

  return 1;

}


/* =========================================================
   READING PAGE STATE
========================================================= */

let readingModeActive = false;

let currentPage = 1;


/*
  ページ単位のスクロール幅。

  縦書きでは右から左へ文章が増えるため、
  1画面分ずつ横方向へ移動させる。
*/

function getPageWidth(){

  const viewport =
    $("readerViewport");

  if(!viewport){
    return 600;
  }

  return Math.max(
    280,
    viewport.clientWidth * .88
  );

}


function updatePageIndicator(){

  const viewport =
    $("readerViewport");

  const indicator =
    $("pageIndicator");

  if(!viewport || !indicator){
    return;
  }

  const maxScroll =
    Math.max(
      0,
      viewport.scrollWidth -
      viewport.clientWidth
    );

  const pageWidth =
    getPageWidth();

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        maxScroll / pageWidth
      ) + 1
    );

  if(
    viewport.scrollLeft <= 2
  ){

    currentPage = 1;

  }else{

    /*
      RTL系のスクロール値はブラウザによって
      扱いが微妙に違うため、ここでは実測値を使う。
    */

    const distance =
      maxScroll -
      Math.max(
        0,
        viewport.scrollLeft
      );

    currentPage =
      Math.min(
        totalPages,
        Math.max(
          1,
          Math.round(
            distance / pageWidth
          ) + 1
        )
      );

  }

  indicator.textContent =
    currentPage +
    " / " +
    totalPages;

}


function movePage(direction){

  const viewport =
    $("readerViewport");

  if(!viewport){
    return;
  }

  const amount =
    getPageWidth() *
    direction;

  viewport.scrollBy({

    left:amount,

    behavior:"smooth"

  });

}


$("readerViewport")
  .addEventListener(
    "scroll",
    updatePageIndicator,
    {passive:true}
  );


$("pagePrev")
  .addEventListener(
    "click",
    ()=>{
      movePage(-1);
    }
  );


$("pageNext")
  .addEventListener(
    "click",
    ()=>{
      movePage(1);
    }
  );


/* =========================================================
   UTILITY
========================================================= */

function characterLength(text){

  return [...text].length;

}


function escapeHtml(text){

  return text.replace(
    /[&<>"']/g,
    char=>{

      const map={

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      };

      return map[char];

    }
  );

}


function currentChapter(){

  return state.chapters[
    state.activeChapter
  ];

}


function syncEditor(){

  const chapter =
    currentChapter();

  if(!chapter){
    return;
  }

  chapter.text =
    $("editor").value;

}


/* =========================================================
   PREVIEW ANIMATION
========================================================= */

function animatePreview(
  newText
){

  clearTimeout(
    animationTimer
  );


  const token =
    ++animationToken;


  const preview =
    $("preview");


  if(
    newText.startsWith(
      displayedPreviewText
    ) &&
    newText.length >
    displayedPreviewText.length
  ){

    const oldText =
      displayedPreviewText;


    const addedText =
      newText.slice(
        oldText.length
      );


    preview.textContent =
      oldText;


    const speed =
      getAnimationSpeed(
        [...addedText].length
      );


    const characters =
      [...addedText];


    let index = 0;


    function typeNext(){

      if(
        token !== animationToken
      ){
        return;
      }


      if(
        index >=
        characters.length
      ){

        preview.textContent =
          newText;

        displayedPreviewText =
          newText;

        updatePageIndicator();

        return;

      }


      preview.textContent =
        oldText +
        characters
          .slice(
            0,
            index + 1
          )
          .join("");


      index++;


      animationTimer =
        setTimeout(
          typeNext,
          speed
        );

    }


    typeNext();

    return;

  }


  displayedPreviewText =
    newText;


  preview.textContent =
    newText;


  requestAnimationFrame(
    updatePageIndicator
  );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  syncEditor();


  const chapter =
    currentChapter();


  if(!chapter){
    return;
  }


  const total =
    state.chapters.reduce(
      (sum,item)=>
        sum +
        characterLength(
          item.text
        ),
      0
    );


  $("titleInput").value =
    state.title;


  $("bookTitle").textContent =
    state.title;


  $("bookMeta").textContent =
    chapter.title +
    "　" +
    characterLength(
      chapter.text
    ).toLocaleString() +
    "字";


  $("characterCount").textContent =
    characterLength(
      chapter.text
    ).toLocaleString() +
    "字";


  $("lineCount").textContent =
    (
      chapter.text
        ? chapter.text.split("\n").length
        : 0
    ).toLocaleString() +
    "行";


  $("totalCharacters").textContent =
    total.toLocaleString() +
    "字";


  renderChapters();


  requestAnimationFrame(
    updatePageIndicator
  );

}


/* =========================================================
   CHAPTER LIST
========================================================= */

function renderChapters(){

  const container =
    $("chapters");


  container.innerHTML =
    "";


  state.chapters.forEach(
    (chapter,index)=>{

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "chapter" +
        (
          index ===
          state.activeChapter
            ? " active"
            : ""
        );


      button.innerHTML =
        escapeHtml(
          chapter.title
        ) +
        "<small>" +
        characterLength(
          chapter.text
        ).toLocaleString() +
        "字</small>";


      button.addEventListener(
        "click",
        ()=>switchChapter(index)
      );


      container.appendChild(
        button
      );

    }
  );


  $("chapterCount").textContent =
    state.chapters.length;

}


/* =========================================================
   SWITCH CHAPTER
========================================================= */

function switchChapter(
  index
){

  clearTimeout(
    animationTimer
  );

  animationToken++;


  syncEditor();


  state.activeChapter =
    index;


  const chapter =
    currentChapter();


  $("editor").value =
    chapter.text;


  displayedPreviewText =
    chapter.text;


  $("preview").textContent =
    chapter.text;


  $("readerViewport")
    .scrollLeft = 0;


  currentPage = 1;


  render();

  scheduleSave();

}


/* =========================================================
   AUTO SAVE
========================================================= */

function scheduleSave(){

  clearTimeout(
    saveTimer
  );


  $("saveState").textContent =
    "保存中…";


  $("status").textContent =
    "編集中";


  saveTimer =
    setTimeout(
      saveState,
      400
    );

}


function saveState(){

  clearTimeout(
    saveTimer
  );


  syncEditor();


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );


  $("saveState").textContent =
    "保存済み";


  $("status").textContent =
    "保存しました";

}


$("saveButton")

/* =========================================================
   READING MODE
========================================================= */

function enterReadingMode(){

  readingModeActive = true;


  $("reader")
    .classList
    .add("reading");


  $("readingMode")
    .classList
    .add("active");


  $("writeMode")
    .classList
    .remove("active");


  $("mobilePreview")
    .classList
    .remove("active");


  /*
    読書開始時は本文の右端から。
  */

  requestAnimationFrame(
    ()=>{

      const viewport =
        $("readerViewport");


      viewport.scrollLeft =
        0;


      currentPage = 1;


      updatePageIndicator();

    }
  );

}


function exitReadingMode(){

  readingModeActive = false;


  $("reader")
    .classList
    .remove("reading");


  $("readingMode")
    .classList
    .remove("active");


  $("writeMode")
    .classList
    .add("active");


  /*
    モバイルプレビューとして開いていた場合も
    読書モード解除時には閉じる。
  */

  $("reader")
    .classList
    .remove("mobile-preview");

}


$("readingMode")
  .addEventListener(
    "click",
    enterReadingMode
  );


$("writeMode")
  .addEventListener(
    "click",
    exitReadingMode
  );


$("exitReading")
  .addEventListener(
    "click",
    exitReadingMode
  );


$("mobilePreview")
  .addEventListener(
    "click",
    ()=>{

      if(readingModeActive){
        return;
      }

      $("reader")
        .classList
        .toggle(
          "mobile-preview"
        );

    }
  );


/* =========================================================
   WHEEL PAGE NAVIGATION
========================================================= */

/*
  読書モードでは縦ホイールを
  横方向のページ送りに変換する。

  これで長編でも、
  「下へ延々スクロール」ではなく
  「ページを送る」感覚になる。
*/

$("readerViewport")
  .addEventListener(
    "wheel",
    event=>{

      if(!readingModeActive){
        return;
      }

      if(
        Math.abs(event.deltaY) >
        Math.abs(event.deltaX)
      ){

        event.preventDefault();

        const direction =
          event.deltaY > 0
            ? 1
            : -1;

        movePage(direction);

      }

    },
    {passive:false}
  );


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() === "s"
    ){

      event.preventDefault();

      saveState();

    }


    if(
      event.key === "Escape"
    ){

      document
        .querySelectorAll(
          ".modal-bg.open"
        )
        .forEach(
          modal =>
            modal.classList.remove(
              "open"
            )
        );


      if(readingModeActive){

        exitReadingMode();

      }

      return;

    }


    /*
      読書モード中のページ送り。
    */

    if(readingModeActive){

      if(
        event.key === "ArrowLeft"
      ){

        event.preventDefault();

        movePage(-1);

      }


      if(
        event.key === "ArrowRight"
      ){

        event.preventDefault();

        movePage(1);

      }

    }

  }
);


/* =========================================================

========================================================= */

function downloadFile(
  filename,
  content,
  mime
){

  const blob =
    new Blob(
      [content],
      {
        type:mime
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    filename;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );

}

${escapeHtml(state.title)}
</h1>

</main>

      downloadFile(
