<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>縦読み小説エディタ</title>
<style>
:root{--bg:#0b0d10;--panel:#11151a;--panel2:#161b21;--line:#29313a;--text:#eef1f4;--muted:#8f99a4;--accent:#c8a96b;--paper:#f7f3eb;--ink:#27231e;--shadow:0 24px 70px rgba(0,0,0,.35);--font:'Yu Mincho','Hiragino Mincho ProN','Hiragino Mincho Pro','Noto Serif JP',serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.app{height:100vh;display:grid;grid-template-rows:64px 1fr 38px}.top{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(11,13,16,.94);backdrop-filter:blur(14px);z-index:5}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:34px;height:34px;border:1px solid #635437;border-radius:9px;display:grid;place-items:center;color:var(--accent);font-family:var(--font);font-size:19px}.brand h1{font-size:14px;letter-spacing:.08em;margin:0}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px;letter-spacing:.12em}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer}.btn:hover{border-color:#4b5662}.btn.primary{background:#d0b273;color:#17130d;border-color:#d0b273;font-weight:700}.work{min-height:0;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);overflow:hidden}.reader{position:relative;min-width:0;background:#25282c;display:flex;flex-direction:column}.reader-head,.editor-head{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(17,21,26,.94);flex:none}.reader-head{border-color:#363b40}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.14em}.reader-title{font-family:var(--font);font-size:15px;margin-left:10px}.paper-wrap{min-height:0;flex:1;overflow:auto;padding:38px 42px;display:flex;justify-content:center}.paper{position:relative;height:calc(100% - 0px);min-height:560px;width:min(760px,100%);background:var(--paper);color:var(--ink);box-shadow:var(--shadow);padding:55px 65px;overflow:hidden}.paper-meta{writing-mode:vertical-rl;position:absolute;right:19px;top:22px;color:#8d8375;font-size:10px;letter-spacing:.12em}.novel{height:100%;writing-mode:vertical-rl;text-orientation:mixed;overflow-x:auto;overflow-y:hidden;font-family:var(--font);font-size:19px;line-height:2.05;letter-spacing:.055em;white-space:pre-wrap;word-break:normal;scrollbar-width:thin}.novel::first-letter{font-size:1.12em}.novel p{margin:0 0 0 1.7em}.novel .placeholder{color:#aaa096}.reader-foot{height:36px;display:flex;align-items:center;justify-content:center;color:#777;font-size:10px;gap:15px;flex:none}.editor{min-width:0;background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--line)}.editor-title{font-weight:650}.counter{font-size:11px;color:var(--muted)}.editor-body{min-height:0;flex:1;display:flex;flex-direction:column;padding:18px;gap:12px}.field-title{display:flex;gap:10px}.title-input{width:100%;background:#0d1014;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:12px 13px;outline:none}.title-input:focus,textarea:focus,select:focus{border-color:#65717e;box-shadow:0 0 0 3px rgba(140,155,170,.08)}textarea{flex:1;min-height:0;width:100%;resize:none;background:#0d1014;border:1px solid var(--line);border-radius:10px;color:#e7ebee;padding:18px;line-height:1.85;font-family:var(--font);font-size:16px;outline:none}.hint{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px}.setting{background:#0d1014;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.setting label{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}.setting select,.setting input[type=range]{width:100%;background:transparent;color:var(--text)}.bottom{display:flex;align-items:center;gap:10px;padding:0 18px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.status{margin-left:auto}.toast{position:fixed;right:20px;bottom:55px;background:#171c21;border:1px solid #39434d;border-radius:9px;padding:10px 14px;box-shadow:var(--shadow);font-size:12px;z-index:20;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}.mobile-only{display:none}@media(max-width:900px){.work{grid-template-columns:1fr}.reader{display:none}.mobile-only{display:inline-flex}.editor{border-left:0}.editor-body{padding:12px}.top{padding:0 12px}.brand small{display:none}}@media(max-width:600px){.top{height:58px}.app{grid-template-rows:58px 1fr 34px}.top-actions .btn:not(.primary){display:none}.settings{grid-template-columns:1fr}.paper{padding:38px}.novel{font-size:17px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="brand-mark">縦</div><div><h1>縦読み小説エディタ</h1><small>VERTICAL NOVEL WORKSPACE</small></div></div><div class="top-actions"><button class="btn" id="clearBtn">新規作品</button><button class="btn" id="saveBtn">保存</button><button class="btn primary" id="readBtn">読書モード</button></div></header>
<main class="work" id="work">
<section class="reader"><div class="reader-head"><div><span class="eyebrow">PREVIEW</span><span class="reader-title" id="previewTitle">無題</span></div><span class="eyebrow">LIVE</span></div><div class="paper-wrap"><article class="paper"><div class="paper-meta">INCL NOVEL EDITOR</div><div class="novel" id="preview"><span class="placeholder">右側に文章を入力すると、ここに小説として綴られていきます。</span></div></article></div><div class="reader-foot"><span>縦書き</span><span>右から左へ</span><span id="saveState">未保存</span></div></section>
<section class="editor"><div class="editor-head"><div><span class="eyebrow">MANUSCRIPT</span><div class="editor-title">執筆</div></div><span class="counter" id="count">0文字</span></div><div class="editor-body"><div class="field-title"><input class="title-input" id="title" placeholder="作品タイトル" value="無題"></div><textarea id="text" spellcheck="false" placeholder="ここから物語を書き始めてください。\n\n文章を入力すると左側の縦書きプレビューへリアルタイムに反映されます。"></textarea><div class="hint"><span>自動保存：ブラウザ内に保存</span><span>Ctrl / ⌘ + S</span></div><div class="settings"><div class="setting"><label>文字サイズ</label><input id="size" type="range" min="14" max="30" value="19"></div><div class="setting"><label>行間</label><input id="line" type="range" min="1.4" max="2.6" step=".05" value="2.05"></div><div class="setting"><label>書体</label><select id="font"><option value="serif">明朝</option><option value="sans">ゴシック</option></select></div><div class="setting"><label>紙面</label><select id="paper"><option value="light">白</option><option value="warm">生成り</option><option value="dark">夜</option></select></div></div></div></section>
</main><footer class="bottom"><span>リアルタイムプレビュー</span><span>•</span><span>作品データはこのブラウザに保存</span><span class="status" id="status">準備完了</span></footer>
</div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);const text=$('text'),title=$('title'),preview=$('preview');
function render(){const v=text.value; $('count').textContent=v.replace(/\s/g,'').length+'文字';$('previewTitle').textContent=title.value||'無題';preview.innerHTML=v?escapeHtml(v).replace(/\n/g,'<br>'):'<span class="placeholder">右側に文章を入力すると、ここに小説として綴られていきます。</span>';apply();$('saveState').textContent='未保存';$('status').textContent='編集中'}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function apply(){preview.style.fontSize=$('size').value+'px';preview.style.lineHeight=$('line').value;preview.style.fontFamily=$('font').value==='sans'?'system-ui,sans-serif':"'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif";const p=$('paper').value;document.querySelector('.paper').style.background=p==='warm'?'#eee5d5':p==='dark'?'#292722':'#f7f3eb';document.querySelector('.paper').style.color=p==='dark'?'#eee8db':'#27231e'}
let timer;function autosave(){clearTimeout(timer);timer=setTimeout(()=>{localStorage.setItem('verticalNovel',JSON.stringify({title:title.value,text:text.value,size:$('size').value,line:$('line').value,font:$('font').value,paper:$('paper').value}));$('saveState').textContent='自動保存済み';$('status').textContent='保存済み'},500)}
[text,title].forEach(el=>el.addEventListener('input',()=>{render();autosave()}));['size','line','font','paper'].forEach(id=>$(id).addEventListener('input',()=>{apply();autosave()}));
$('saveBtn').onclick=()=>{autosave();$('saveState').textContent='保存済み';toast('作品を保存しました')};
$('clearBtn').onclick=()=>{if(confirm('現在の作品を消して新しい作品を作りますか？')){title.value='無題';text.value='';render();localStorage.removeItem('verticalNovel');toast('新しい作品を開始しました')}};
$('readBtn').onclick=()=>{document.body.classList.toggle('reading');if(document.body.classList.contains('reading')){document.querySelector('.editor').style.display='none';document.querySelector('.work').style.gridTemplateColumns='1fr';$('readBtn').textContent='執筆に戻る'}else{document.querySelector('.editor').style.display='flex';document.querySelector('.work').style.gridTemplateColumns='minmax(0,1.12fr) minmax(360px,.88fr)';$('readBtn').textContent='読書モード'}};
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('saveBtn').click()}if(e.key==='Escape'&&document.body.classList.contains('reading'))$('readBtn').click()});
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
const saved=localStorage.getItem('verticalNovel');if(saved){try{const d=JSON.parse(saved);title.value=d.title||'無題';text.value=d.text||'';['size','line','font','paper'].forEach(k=>d[k]!=null&&($(k).value=d[k]))}catch{}}render();
</script></body></html>
