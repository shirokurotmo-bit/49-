<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>縦読み小説エディタ PRO</title>

<style>
:root{
  --bg:#0b0d10;
  --panel:#11151a;
  --panel2:#171c22;
  --line:#2b333d;
  --text:#edf1f5;
  --muted:#8d98a5;
  --accent:#9abfff;
  --paper:#f7f3ea;
  --ink:#252525;
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,"Noto Sans JP",sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  display:grid;
  grid-template-rows:58px minmax(0,1fr) 30px;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 16px;
  background:rgba(17,21,26,.98);
  border-bottom:1px solid var(--line);
  z-index:20;
}

.brand{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
}

.brand span{
  color:var(--accent);
}

.title-input{
  width:min(360px,35vw);
  padding:7px 0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:15px;
  font-weight:700;
}

.header-actions{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.btn,
.tool{
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 11px;
  background:var(--panel2);
  color:var(--text);
}

.btn:hover,
.tool:hover{
  background:#1d242c;
}

.btn-primary{
  background:#dce9ff;
  border-color:#dce9ff;
  color:#182237;
  font-weight:700;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);
}

/* =========================================================
   READER
========================================================= */

.reader{
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-rows:46px minmax(0,1fr);
  background:#d9d5cc;
  border-right:1px solid var(--line);
  overflow:hidden;
}

.reader-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(247,243,234,.96);
  color:#444;
  border-bottom:1px solid #c9c2b7;
}

.reader-header strong{
  font-size:13px;
}

.reader-header span{
  color:#777;
  font-size:11px;
}

.reader-viewport{
  min-width:0;
  min-height:0;
  overflow:auto;
  padding:28px;
  direction:ltr;
}

.book{
  min-height:calc(100% - 10px);
  width:max-content;
  min-width:100%;
  background:var(--paper);
  color:var(--ink);
  padding:48px 58px;
  box-shadow:0 18px 55px rgba(0,0,0,.22);

  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

.book-title{
  writing-mode:vertical-rl;
  text-orientation:mixed;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  font-size:30px;
  font-weight:700;
  line-height:1.8;

  align-self:flex-start;
  margin-bottom:26px;

  white-space:nowrap;
}

.book-meta{
  align-self:flex-start;
  color:#777;
  font-size:12px;
  margin-bottom:18px;
  white-space:nowrap;
}

/*
  実際の本文。
  vertical-rl によって右端から左方向へ
  新しい縦列が形成される。
*/

.vertical-text{
  writing-mode:vertical-rl;
  text-orientation:mixed;
  direction:ltr;

  white-space:pre-wrap;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  font-size:18px;
  line-height:1.9;
  letter-spacing:.08em;

  width:100%;
  min-height:65%;

  overflow:visible;
}

/* =========================================================
   文字アニメーション
========================================================= */

.novel-char{
  display:inline;
  opacity:1;
}

.novel-char.typing{
  animation:
    novelCharacterIn
    .18s
    cubic-bezier(.2,.75,.25,1)
    both;
}

@keyframes novelCharacterIn{

  0%{
    opacity:0;
    filter:blur(3px);
  }

  45%{
    opacity:.55;
    filter:blur(1px);
  }

  100%{
    opacity:1;
    filter:blur(0);
  }

}


/*
  新しく入力された文字の最後だけ
  ごく短時間だけ「書き上がった」感じを出す。
*/

.novel-char.latest{
  animation:
    novelLatest
    .28s
    ease-out
    both;
}

@keyframes novelLatest{

  0%{
    opacity:.15;
    text-shadow:0 0 8px rgba(60,50,35,.25);
  }

  100%{
    opacity:1;
    text-shadow:none;
  }

}

/* =========================================================
   WRITER
========================================================= */

.writer{
  min-width:0;
  min-height:0;
  background:var(--panel);

  display:grid;
  grid-template-rows:50px minmax(0,1fr);
}

.toolbar{
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 10px;

  border-bottom:1px solid var(--line);

  overflow:auto;
}

.tool{
  background:transparent;
  border-color:transparent;
  color:var(--muted);
  white-space:nowrap;
}

.tool.active,
.tool:hover{
  background:#1b222a;
  border-color:var(--line);
  color:var(--text);
}

/* =========================================================
   EDITOR
========================================================= */

.editor-area{
  min-height:0;

  display:grid;
  grid-template-columns:190px minmax(0,1fr);
}

.chapter-list{
  min-height:0;
  overflow:auto;

  padding:10px;

  border-right:1px solid var(--line);
}

.chapter-list-header{
  padding:5px 6px 9px;

  color:var(--muted);
  font-size:12px;
}

.chapter{
  width:100%;
  display:block;

  margin-bottom:5px;
  padding:10px;

  border:1px solid transparent;
  border-radius:8px;

  background:transparent;
  color:#b7c0ca;

  text-align:left;
}

.chapter:hover{
  background:#191f26;
}

.chapter.active{
  background:#202833;
  border-color:#364251;
  color:#fff;
}

.chapter small{
  display:block;
  margin-top:4px;

  color:#7e8996;
  font-size:10px;
}

.editor-wrapper{
  min-width:0;
  min-height:0;
  position:relative;
}

#editor{
  width:100%;
  height:100%;

  resize:none;

  border:0;
  outline:0;

  padding:30px 32px 80px;

  background:#101419;
  color:#edf1f5;

  font-size:17px;
  line-height:1.95;
  letter-spacing:.02em;

  overflow:auto;
}

#editor::selection{
  background:#405f85;
  color:#fff;
}

.editor-info{
  position:absolute;
  right:14px;
  bottom:12px;

  padding:5px 8px;

  border-radius:6px;

  background:rgba(16,20,25,.9);

  color:#7f8995;
  font-size:11px;

  pointer-events:none;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  display:flex;
  align-items:center;
  padding:0 12px;

  border-top:1px solid var(--line);

  color:var(--muted);
  font-size:11px;
}

.status{
  margin-left:auto;
}

/* =========================================================
   MODAL
========================================================= */

.modal-bg{
  position:fixed;
  inset:0;

  display:none;
  place-items:center;

  background:rgba(0,0,0,.62);

  z-index:100;
}

.modal-bg.open{
  display:grid;
}

.modal{
  width:min(540px,92vw);

  padding:20px;

  border:1px solid var(--line);
  border-radius:13px;

  background:#161b21;

  box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.modal h2{
  margin:0 0 16px;
  font-size:18px;
}

.field{
  display:grid;
  gap:6px;
  margin-bottom:12px;
}

.field label{
  color:var(--muted);
  font-size:12px;
}

.field input,
.field select{
  width:100%;
  padding:9px;

  border:1px solid var(--line);
  border-radius:7px;

  outline:0;

  background:#0e1216;
  color:var(--text);
}

.field-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:16px;
}

/* =========================================================
   READING MODE
========================================================= */

.reader.reading{
  position:fixed;
  inset:58px 0 30px;

  z-index:50;

  border:0;

  grid-template-rows:minmax(0,1fr);
}

.reader.reading .reader-header{
  display:none;
}

.reader.reading .reader-viewport{
  padding:0;
}

.reader.reading .book{
  min-height:100%;
  box-shadow:none;
  border-radius:0;
  padding:55px 70px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .workspace{
    grid-template-columns:1fr;
  }

  .reader{
    display:none;
  }

  .reader.mobile-preview{
    display:grid;

    position:fixed;
    inset:58px 0 30px;

    z-index:50;

    border:0;
  }

  .editor-area{
    grid-template-columns:145px minmax(0,1fr);
  }
}

@media(max-width:620px){

  .topbar{
    padding:0 10px;
    gap:8px;
  }

  .brand{
    font-size:13px;
  }

  .title-input{
    width:30vw;
    font-size:13px;
  }

  .header-actions .secondary{
    display:none;
  }

  .editor-area{
    grid-template-columns:1fr;
  }

  .chapter-list{
    display:none;
  }

  #editor{
    padding:20px 17px 70px;
    font-size:16px;
  }

  .reader-viewport{
    padding:15px;
  }

  .book{
    padding:28px 24px;
  }

  .book-title{
    font-size:25px;
  }

}

</style>
</head>


<body>

<div class="app">

<header class="topbar">

  <div class="brand">
    縦読み小説 <span>PRO</span>
  </div>

  <input
    id="titleInput"
    class="title-input"
    value="新しい物語"
    placeholder="作品タイトル"
  >

  <div class="header-actions">

    <button class="btn secondary" id="newButton">
      新規
    </button>

    <button class="btn secondary" id="settingsButton">
      設定
    </button>

    <button class="btn btn-primary" id="saveButton">
      保存
    </button>

  </div>

</header>


<main class="workspace">

<section id="reader" class="reader">

  <div class="reader-header">

    <strong>
      完成プレビュー
    </strong>

    <span id="totalCharacters">
      0字
    </span>

  </div>


  <div class="reader-viewport">

    <article class="book">

      <div
        id="bookTitle"
        class="book-title"
      ></div>

      <div
        id="bookMeta"
        class="book-meta"
      ></div>

      <div
        id="preview"
        class="vertical-text"
      ></div>

    </article>

  </div>

</section>


<section class="writer">

  <div class="toolbar">

    <button
      id="writeMode"
      class="tool active"
    >
      執筆
    </button>

    <button
      id="readingMode"
      class="tool"
    >
      読書
    </button>

    <button
      id="mobilePreview"
      class="tool"
    >
      プレビュー
    </button>

    <button
      id="addChapter"
      class="tool"
    >
      ＋章
    </button>

    <button
      id="exportTxt"
      class="tool"
    >
      TXT
    </button>

    <button
      id="exportHtml"
      class="tool"
    >
      HTML
    </button>

  </div>


  <div class="editor-area">

    <aside class="chapter-list">

      <div class="chapter-list-header">
        章
        <span id="chapterCount">1</span>
      </div>

      <div id="chapters"></div>

    </aside>


    <div class="editor-wrapper">

      <textarea
        id="editor"
        spellcheck="false"
        placeholder="ここに小説を書いてください。入力した文章は左側にリアルタイムで綴られていきます。"
      ></textarea>


      <div class="editor-info">

        <span id="characterCount">
          0字
        </span>

        <span>　</span>

        <span id="lineCount">
          0行
        </span>

        <span>　</span>

        <span id="saveState">
          未保存
        </span>

      </div>

    </div>

  </div>

</section>

</main>


<footer class="footer">

  <span>
    右端から左方向へ流れる縦書き
  </span>

  <span
    class="status"
    id="status"
  >
    準備完了
  </span>

</footer>

</div>


<!-- SETTINGS -->

<div
  id="settingsModal"
  class="modal-bg"
>

  <div class="modal">

    <h2>
      表示設定
    </h2>


    <div class="field-row">

      <div class="field">

        <label>
          文字サイズ
        </label>

        <input
          id="fontSize"
          type="number"
          min="12"
          max="40"
        >

      </div>


      <div class="field">

        <label>
          行間
        </label>

        <input
          id="lineHeight"
          type="number"
          min="1"
          max="3"
          step=".05"
        >

      </div>

    </div>


    <div class="field-row">

      <div class="field">

        <label>
          字間
        </label>

        <input
          id="letterSpacing"
          type="number"
          min="0"
          max=".5"
          step=".01"
        >

      </div>


      <div class="field">

        <label>
          書体
        </label>

        <select id="fontFamily">

          <option value='"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif'>
            明朝
          </option>

          <option value='"Noto Sans JP",system-ui,sans-serif'>
            ゴシック
          </option>

        </select>

      </div>

    </div>


    <div class="modal-actions">

      <button
        class="btn"
        id="closeSettings"
      >
        閉じる
      </button>

    </div>

  </div>

</div>


<!-- NEW WORK -->

<div
  id="newModal"
  class="modal-bg"
>

  <div class="modal">

    <h2>
      新しい作品
    </h2>

    <div class="field">

      <label>
        作品タイトル
      </label>

      <input
        id="newTitle"
        value="新しい物語"
      >

    </div>


    <div class="modal-actions">

      <button
        class="btn"
        id="cancelNew"
      >
        キャンセル
      </button>

      <button
        class="btn btn-primary"
        id="createNew"
      >
        作成
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   STATE
========================================================= */

const STORAGE_KEY =
  "vertical-novel-pro-animation-v1";


const $ = id =>
  document.getElementById(id);


function createDefaultState(){

  return {

    title:"新しい物語",

    activeChapter:0,

    chapters:[
      {
        title:"第一章",
        text:""
      }
    ],

    settings:{

      fontSize:18,

      lineHeight:1.9,

      letterSpacing:.08,

      fontFamily:
        '"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif'

    }

  };

}


function loadState(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw){

      return createDefaultState();

    }

    const parsed =
      JSON.parse(raw);

    if(
      !parsed ||
      !Array.isArray(parsed.chapters) ||
      parsed.chapters.length === 0
    ){

      return createDefaultState();

    }

    return parsed;

  }catch{

    return createDefaultState();

  }

}


let state =
  loadState();


let saveTimer = null;


/* =========================================================
   ANIMATION STATE
========================================================= */

let animationTimer = null;

let displayedPreviewText = "";

let animationToken = 0;


/*
 * 長文貼り付け時に何千文字も一文字ずつ
 * アニメーションさせると逆に邪魔なので、
 * 入力文字数に応じて速度を自動調整。
 */

function getAnimationSpeed(
  addedLength
){

  if(addedLength <= 5){
    return 28;
  }

  if(addedLength <= 20){
    return 18;
  }

  if(addedLength <= 80){
    return 7;
  }

  return 1;

}


/* =========================================================
   UTILITY
========================================================= */

function characterLength(text){

  return [...text].length;

}


function escapeHtml(text){

  return text.replace(
    /[&<>"']/g,
    char=>{

      const map={

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      };

      return map[char];

    }
  );

}


function currentChapter(){

  return state.chapters[
    state.activeChapter
  ];

}


function syncEditor(){

  const chapter =
    currentChapter();

  if(!chapter){
    return;
  }

  chapter.text =
    $("editor").value;

}


/* =========================================================
   PREVIEW ANIMATION
========================================================= */

function animatePreview(
  newText
){

  clearTimeout(
    animationTimer
  );


  const token =
    ++animationToken;


  const preview =
    $("preview");


  /*
   * 如果是普通追加输入，
   * 只对新增部分做动画。
   */

  if(
    newText.startsWith(
      displayedPreviewText
    ) &&
    newText.length >
    displayedPreviewText.length
  ){

    const oldText =
      displayedPreviewText;


    const addedText =
      newText.slice(
        oldText.length
      );


    /*
     * 先显示已经完成的文章。
     */

    preview.textContent =
      oldText;


    /*
     * 文字数が多い場合は高速化。
     */

    const speed =
      getAnimationSpeed(
        [...addedText].length
      );


    let index = 0;


    function typeNext(){

      if(
        token !== animationToken
      ){

        return;

      }


      if(
        index >=
        [...addedText].length
      ){

        preview.textContent =
          newText;

        displayedPreviewText =
          newText;

        return;

      }


      const characters =
        [...addedText];


      const current =
        characters
          .slice(
            0,
            index + 1
          )
          .join("");


      preview.textContent =
        oldText +
        current;


      index++;


      animationTimer =
        setTimeout(
          typeNext,
          speed
        );

    }


    typeNext();

    return;

  }


  /*
   * 削除、貼り付け位置変更、
   * 章変更などの場合は即時反映。
   */

  displayedPreviewText =
    newText;


  preview.textContent =
    newText;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  syncEditor();


  const chapter =
    currentChapter();


  if(!chapter){
    return;
  }


  const total =
    state.chapters.reduce(
      (sum,item)=>
        sum +
        characterLength(
          item.text
        ),
      0
    );


  $("titleInput").value =
    state.title;


  $("bookTitle").textContent =
    state.title;


  $("bookMeta").textContent =
    chapter.title +
    "　" +
    characterLength(
      chapter.text
    ).toLocaleString() +
    "字";


  $("characterCount").textContent =
    characterLength(
      chapter.text
    ).toLocaleString() +
    "字";


  $("lineCount").textContent =
    (
      chapter.text
        ? chapter.text.split("\n").length
        : 0
    ).toLocaleString() +
    "行";


  $("totalCharacters").textContent =
    total.toLocaleString() +
    "字";


  renderChapters();

}


/* =========================================================
   CHAPTER LIST
========================================================= */

function renderChapters(){

  const container =
    $("chapters");


  container.innerHTML =
    "";


  state.chapters.forEach(
    (chapter,index)=>{

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "chapter" +
        (
          index ===
          state.activeChapter
            ? " active"
            : ""
        );


      button.innerHTML =
        escapeHtml(
          chapter.title
        ) +
        "<small>" +
        characterLength(
          chapter.text
        ).toLocaleString() +
        "字</small>";


      button.addEventListener(
        "click",
        ()=>switchChapter(index)
      );


      container.appendChild(
        button
      );

    }
  );


  $("chapterCount").textContent =
    state.chapters.length;

}


/* =========================================================
   SWITCH CHAPTER
========================================================= */

function switchChapter(
  index
){

  clearTimeout(
    animationTimer
  );

  animationToken++;


  syncEditor();


  state.activeChapter =
    index;


  const chapter =
    currentChapter();


  $("editor").value =
    chapter.text;


  displayedPreviewText =
    chapter.text;


  $("preview").textContent =
    chapter.text;


  render();

  scheduleSave();

}


/* =========================================================
   AUTO SAVE
========================================================= */

function scheduleSave(){

  clearTimeout(
    saveTimer
  );


  $("saveState").textContent =
    "保存中…";


  $("status").textContent =
    "編集中";


  saveTimer =
    setTimeout(
      saveState,
      400
    );

}


function saveState(){

  clearTimeout(
    saveTimer
  );


  syncEditor();


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );


  $("saveState").textContent =
    "保存済み";


  $("status").textContent =
    "保存しました";

}


/* =========================================================
   EDITOR INPUT
========================================================= */

$("editor").addEventListener(
  "input",
  ()=>{

    syncEditor();


    const text =
      currentChapter().text;


    /*
     * 本文を左側へアニメーション。
     */

    animatePreview(
      text
    );


    /*
     * メタ情報更新。
     */

    $("bookMeta").textContent =
      currentChapter().title +
      "　" +
      characterLength(
        text
      ).toLocaleString() +
      "字";


    $("characterCount").textContent =
      characterLength(
        text
      ).toLocaleString() +
      "字";


    $("lineCount").textContent =
      (
        text
          ? text.split("\n").length
          : 0
      ).toLocaleString() +
      "行";


    const total =
      state.chapters.reduce(
        (sum,item)=>
          sum +
          characterLength(
            item.text
          ),
        0
      );


    $("totalCharacters").textContent =
      total.toLocaleString() +
      "字";


    renderChapters();


    scheduleSave();

  }
);

  preview.style.lineHeight =
    settings.lineHeight;


  preview.style.letterSpacing =
    settings.letterSpacing +

}

$("addChapter").addEventListener(
  "click",
  ()=>{

    clearTimeout(
      animationTimer
    );

    animationToken++;


    syncEditor();


    const number =
      state.chapters.length + 1;


    state.chapters.push({

      title:
        "第" +
        number +

      text:""

    });


    state.activeChapter =
      state.chapters.length - 1;

      "";

    $("preview").textContent =
      "";


    render();

    scheduleSave();

  }
);

/* =========================================================
   EXPORT
========================================================= */

function downloadFile(
  filename,
  content,
  mime
){

  const blob =
    new Blob(
      [content],
      {
        type:mime
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    filename;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );

}


$("exportTxt").addEventListener(
  "click",
  ()=>{

    syncEditor();


    const text =
      state.chapters
        .map(
          chapter =>
            chapter.title +
            "\n\n" +
            chapter.text
        )
        .join(
          "\n\n"
        );


    downloadFile(
      state.title +
      ".txt",
      text,
      "text/plain;charset=utf-8"
    );

  }
);


$("exportHtml").addEventListener(
  "click",
  ()=>{

    syncEditor();


    const body =
      state.chapters
        .map(
          chapter =>

            "<h2>" +
            escapeHtml(
              chapter.title
            ) +
            "</h2>" +

            "<div class='novel'>" +
            escapeHtml(
              chapter.text
            ).replace(
              /\n/g,
              "<br>"
            ) +
            "</div>"
        )
        .join("");


    const html =
`<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>${escapeHtml(state.title)}</title>

<style>

body{
  margin:0;
  background:#ddd;
}

.page{
  min-height:100vh;
  padding:60px;
  background:#f7f3ea;
  color:#252525;
}

.novel{
  writing-mode:vertical-rl;
  text-orientation:mixed;

  white-space:pre-wrap;

  height:85vh;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  font-size:${state.settings.fontSize}px;

  line-height:${state.settings.lineHeight};

  letter-spacing:${state.settings.letterSpacing}em;
}

</style>
</head>

<body>

<main class="page">

<h1>
${escapeHtml(state.title)}
</h1>

${body}

</main>

</body>
</html>`;


    downloadFile(
      state.title +
      ".html",
      html,
      "text/html;charset=utf-8"
    );

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() === "s"
    ){

      event.preventDefault();

      saveState();

    }


    if(
      event.key === "Escape"
    ){

      document
        .querySelectorAll(
          ".modal-bg.open"
        )
        .forEach(
          modal =>
            modal.classList.remove(
              "open"
            )
        );

    }

  }
);

displayedPreviewText =

$("preview").textContent =

render();

applySettings();
